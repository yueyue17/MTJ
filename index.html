<style>

:root{

  --bg1:#2b3352;--bg2:#3d4a6b;--card:#445170;--card2:#4e5c80;

  --ink:#eef2ff;--sub:#b9c4e0;--mint:#8fd6c3;--gold:#f2c879;--rose:#e8a1a8;

  --accent:#a7b8ea;--ok:#9fd6a0;--radius:14px;

}

*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%}

body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh}

#app{max-width:720px;margin:0 auto;padding:16px 16px 90px;min-height:100vh;display:flex;flex-direction:column}

.page{display:none;flex:1;flex-direction:column;animation:fadein .35s ease}

.page.active{display:flex}

@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

body.reduced-motion *{animation:none!important;transition:none!important}

h1{font-size:1.8rem;letter-spacing:.12em;text-align:center;margin:40px 0 8px}

h2{font-size:1.25rem;margin:8px 0 14px}

p.sub{color:var(--sub);text-align:center;line-height:1.7}

.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:10px 0;box-shadow:0 4px 14px rgba(0,0,0,.2)}

.btn{display:inline-block;border:none;cursor:pointer;font-size:1rem;background:var(--card2);color:var(--ink);padding:12px 20px;border-radius:12px;min-height:48px;transition:transform .12s,background .2s;font-family:inherit}

.btn:active{transform:scale(.97)}

.btn.primary{background:linear-gradient(120deg,#5f7ac0,#7a8fd0)}

.btn.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent)}

.btn.small{padding:8px 14px;min-height:40px;font-size:.9rem}

.btn:disabled{opacity:.45;cursor:not-allowed}

.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0}

.chip{display:inline-block;background:var(--card2);border:2px solid transparent;border-radius:20px;padding:9px 16px;margin:5px;cursor:pointer;font-size:.95rem;transition:border-color .15s;user-select:none}

.chip.sel{border-color:var(--mint);background:#3f5a63}

.ghost-avatar{width:120px;height:130px;margin:20px auto;position:relative}

.ghost-body{position:absolute;inset:0;border-radius:60px 60px 46px 46px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3));animation:float 3.4s ease-in-out infinite}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.ghost-face{position:absolute;top:44px;left:50%;transform:translateX(-50%);font-size:1.6rem}

.accessory-icon{position:absolute;font-size:1.6rem;z-index:2}

.acc-scarf{bottom:18px;left:50%;transform:translateX(-50%)}

.acc-pearl{top:20px;left:14px}

.acc-star{top:8px;right:8px}

.map-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}

.map-card{background:var(--card);border-radius:var(--radius);padding:16px 12px;cursor:pointer;border:2px solid transparent;text-align:center;transition:border-color .15s}

.map-card:hover{border-color:var(--accent)}

.map-card .em{font-size:1.8rem}

.map-card .t{margin-top:6px;font-weight:600}

.map-card .s{font-size:.78rem;color:var(--sub);margin-top:4px}

.map-card.done{border-color:var(--ok)}

.dialogue-box{background:var(--card);border-radius:var(--radius);padding:18px;line-height:1.8;min-height:120px}

.dialogue-box .speaker{color:var(--gold);font-weight:700;margin-bottom:8px}

.dialogue-box .narr{color:var(--sub);font-size:.88rem;display:block;margin-bottom:10px}

.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}

.progressbar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin:12px 0}

.progressbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--accent));width:0;transition:width .4s}

.bubble{position:absolute;padding:10px 16px;border-radius:40px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);cursor:pointer;animation:bob 3s ease-in-out infinite;user-select:none;max-width:62%}

.bubble.taken{background:rgba(143,214,195,.35);border-color:var(--mint)}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.bubble-area{position:relative;height:240px;background:rgba(0,0,0,.12);border-radius:var(--radius);overflow:hidden}

.hotspot{position:absolute;width:56px;height:56px;border-radius:50%;cursor:pointer;background:radial-gradient(circle,rgba(242,200,121,.6),rgba(242,200,121,.1));border:2px dashed var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.4rem}

.hotspot.got{border-style:solid;background:rgba(159,214,160,.4)}

.scene{position:relative;height:250px;background:rgba(0,0,0,.12);border-radius:var(--radius);overflow:hidden}

.evidence-card,.belief-card,.action-card{background:var(--card2);border-radius:12px;padding:12px 14px;cursor:pointer;border:2px solid transparent;transition:border-color .15s;line-height:1.6;margin:8px 0}

.evidence-card.sel,.belief-card.sel,.action-card.sel{border-color:var(--mint);background:#3f5a63}

.breath-circle{width:160px;height:160px;border-radius:50%;margin:24px auto;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(143,214,195,.25));display:flex;align-items:center;justify-content:center;font-size:1.1rem;animation:breathe 8s ease-in-out infinite;text-align:center;line-height:1.6}

@keyframes breathe{0%,100%{transform:scale(.85)}45%{transform:scale(1.12)}55%{transform:scale(1.12)}}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}

.modal{background:var(--card);border-radius:var(--radius);padding:24px;max-width:420px;width:100%;text-align:center;animation:pop .3s ease;max-height:85vh;overflow-y:auto}

@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

.reward-icon{font-size:3.2rem;margin:10px 0;animation:float 2.5s ease-in-out infinite}

.wardrobe-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--card2);margin:8px 0}

.wardrobe-item.locked{opacity:.55}

.wardrobe-item .preview{width:56px;height:56px;flex-shrink:0}

.navbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:10px;background:rgba(20,25,45,.85);backdrop-filter:blur(8px);z-index:40}

.navbar .btn{min-width:64px}

.tag{font-size:.75rem;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.25)}

.tag.ok{color:var(--ok)}

.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--rose);padding:10px 18px;border-radius:12px;z-index:60;display:none;max-width:90%}

.small-note{font-size:.8rem;color:var(--sub);line-height:1.6}

@media (max-width:480px){h1{font-size:1.5rem}}

</style>

</head>

<script>

/* ================= 数据层：皮肤 / 装饰 ================= */

const SKINS = {

  default:{name:"迷雾白", color:"#dfe6f5", how:"初始皮肤"},

  mint:{name:"薄荷幽", color:"#8fd6c3", how:"完成「孤独」章节"},

  pearl:{name:"珍珠白", color:"#f3e9dc", how:"完成「自责」章节"},

  ember:{name:"暖黄微光", color:"#f2c879", how:"完成「倦怠」章节"},

  star:{name:"星帽蓝", color:"#a7b8ea", how:"完成「焦虑」章节"},

  garden:{name:"渐变新生", color:"#c9b8e8", how:"完成「麻木」章节"},

  bridge:{name:"雾谷青", color:"#9fc6d6", how:"完成「无助」章节"},

};

const ACCESSORIES = {

  scarf:{name:"旧围巾", icon:"🧣", cls:"acc-scarf", how:"完成任一时光长河片段"},

  pearl:{name:"精灵珍珠", icon:"🤍", cls:"acc-pearl", how:"时光长河中收集证据"},

  star:{name:"星星帽", icon:"⭐", cls:"acc-star", how:"时光长河中完成思维重写"},

};

const STAGES = ["student_secondary","university","working","other","skipped"];

const STAGE_LABEL = {student_secondary:"初高中学生",university:"大学生",working:"已工作",other:"其他",skipped:"暂不填写"};

const PRESSURE_TOPICS = ["金钱","学业","事业","人际关系","外貌与自我评价","家庭","未来不确定性","其他"];

/* ================= 序章（完整剧情） ================= */

const PROLOGUE_LINES = [

 {narr:"（场景：悬浮云海之上的希望神殿，柔光漫过大理石立柱，窗外整片忧郁大陆沉在灰蒙蒙的薄雾之中。小小的半透明小幽灵轻飘飘飘进大殿，身体泛着柔和微光。希望女神站在高台边，长发像流动的浅紫色云雾，语气温和，没有高高在上的威严。）"},

 {s:"希望女神",t:"欢迎你，小小的幽灵。你能够抵达这里，就已经拥有很珍贵的力量。"},

 {s:"小幽灵",t:"（轻飘飘晃动身体）这里就是希望神殿吗？外面的大地，为什么到处都是雾？"},

 {s:"希望女神",t:"那片土地名叫忧郁大陆。很久以前，这里遍地花开、溪流歌唱，生灵自在生活。后来，许许多多沉重的情绪慢慢堆积：悲伤、愧疚、疲惫、惶恐、麻木、无力……情绪本身没有错，可是长久没有人听见它们的声音，它们就化作厚厚的阴霾，笼罩了整片大地。"},

 {s:"小幽灵",t:"那……要把这些坏情绪全部赶走吗？"},

 {s:"希望女神",t:"不是赶走哦。情绪不是敌人。孤独、自责、疲惫，都是内心发出的信号。只是大陆上的生灵被困在信号里面，误以为自己要永远承受那份重量。我委托你前往大陆的六个区域，不是要你打败什么怪物。你只需要去倾听，去看见，陪那里的存在看懂自己的心。"},

 {narr:"（女神抬手，神殿的巨大落地窗缓缓变得通透。窗外可以看见六片风格各不相同的朦胧区域：荒芜的荒原、波光幽蓝的贝壳海湾、火光微弱的火山谷地、挂满钟表的风铃小镇、色彩褪尽的寂静花园、断桥弥漫浓雾的山谷。）"},

 {s:"希望女神",t:"那六处，分别被孤独、自责、倦怠、焦虑、麻木、无助的薄雾包裹。你不用按照固定顺序前进，想去哪一处都可以，也不必强迫自己一次性做完所有事。累了，随时可以回到神殿休息。"},

 {s:"小幽灵",t:"我一个幽灵，真的可以做到吗？我好像没有什么强大的力量。"},

 {s:"希望女神",t:"你的力量，叫做「愿意看见」。很多痛苦，仅仅是因为一直没有人停下来好好听一听。记住，不必要求一切立刻变好，哪怕只有一点点松动，就已经足够。去吧，选择你想要最先抵达的地方。"},

 {narr:"（小幽灵望向窗外六片朦胧的土地，故事就此展开。）"},

];

/* ================= 六章（完整剧情） ================= */

const CHAPTERS = [

 {id:"loneliness",title:"孤独",em:"🌲",summary:"荒原上最后一棵树",bg:"无边荒原，风沙轻轻拂过枯黄地面。天地是灰蒙蒙的浅灰蓝，旷野只有孤零零一棵高大古树伫立。",

  steps:[

   {id:"s1",type:"dialogue",narr:"（小幽灵轻飘飘降落，双脚没有触碰尘土，飘到古树的枝干旁。古树的树干布满深深浅浅裂纹，风穿过枯枝，发出呜呜的、像叹气一样的声响。）",speaker:"古树",text:"……又有路过的风吗。"},

   {id:"s2",type:"dialogue",speaker:"小幽灵",text:"大树，你看起来好寂寞。这片荒原，只有你一个吗？"},

   {id:"s3",type:"dialogue",speaker:"古树",text:"很久以前，这里有成片树林。伙伴们一棵接一棵枯萎离开。到现在，只剩下我。我每天站在这里，看风沙来，看落日走。好像我生来就该独自守着这片空空荡荡的荒原。"},

   {id:"s4",type:"dialogue",speaker:"古树",text:"有时候我会想，是不是我本身不够好，所以才没有别的树木愿意留下来陪我。"},

   {id:"s5",type:"dialogue",narr:"（不远处，背着厚重石壳的小虫慢慢爬过来，壳上沾满细细黄沙。）",speaker:"石壳小虫",text:"大树又在自言自语啦。我每天都会路过这里，只是我体型太小，大树总看不见我。"},

   {id:"s6",type:"dialogue",speaker:"石壳小虫",text:"我总觉得，我这么渺小，我的陪伴没有意义。大树那么高大，它需要的应该是另一棵大树，不是一只微不足道的小虫。我怕我的靠近，对它来说不算陪伴。",choices:[

     {label:"你的靠近，对大树来说一定有意义",feedback:"小虫缩进自己石壳，沉默蹲坐在树根边。",next:"s7"},

     {label:"先听听云雀和土拨鼠怎么说",feedback:"小虫点点头，安静地退到一旁。",next:"s7"}]},

   {id:"s7",type:"dialogue",narr:"（天空掠过一只云雀，盘旋一圈落在干枯树枝，翅膀羽毛暗淡，它总是不停飞来飞去。）",speaker:"漂泊云雀",text:"我不停到处飞，去过很多很远的地方。可无论飞到哪里，心里空空的感觉消不掉。我以为只要不停赶路，就不会感受到孤单。"},

   {id:"s8",type:"dialogue",speaker:"漂泊云雀",text:"不是的。飞得再远，如果没有人分享看见的晚霞，再美的风景也只是风景。我害怕停下来，一旦停下，就必须直面心里空荡荡的感受。"},

   {id:"s9",type:"dialogue",narr:"（地面的土拨鼠从土洞探出圆滚滚脑袋，怯生生张望。）",speaker:"土拨鼠",text:"我住在地下洞穴里。我很想靠近大树，可是我很害怕主动。我总在等别人先来找我。如果没有人走向我，那我就安安静静待在洞里就好了。至少，就不会体会被拒绝的难受。"},

   {id:"s10",type:"dialogue",speaker:"小幽灵",text:"大树，我和这里的小伙伴聊过了。孤独不一定代表身边完全没有生命。小虫每天都来树根下歇脚；云雀常常飞回你的枝头；土拨鼠在地下，一直远远望着你。只是大家全都误以为，只有同等强大、同等模样的伙伴，才算真正陪伴。"},

   {id:"s11",type:"dialogue",speaker:"古树",text:"可是……它们都不是树。我想要同类。",choices:[

     {label:"陪伴有很多模样，不一定要一模一样",feedback:"古树沉默了很久，呼啸风沙慢慢放缓。",next:"s12"},

     {label:"如果伸出枝干，会不会被忽视呢？",feedback:"「会有这种可能性。」小幽灵轻轻说，「但如果一直封闭自己，就完全没有机会感受暖意。」",next:"s12"}]},

   {id:"s12",type:"dialogue",speaker:"小幽灵",text:"小虫可以和你讲地下泥土的故事；云雀可以把远方山谷的消息带回来；土拨鼠会告诉你春雨什么时候快要降临。陪伴，不是填补全部空缺，只是愿意分出一点点时间，看见彼此的存在。你不必强迫自己立刻变得热闹，只需要，轻轻伸出一截枝条就够了。"},

   {id:"s13",type:"dialogue",narr:"（古树缓缓调动残存力量，一根细嫩崭新的新芽，从苍老树干侧边慢慢钻出来。它把低垂的枝条放低一点，刚好能够让小虫爬到枝干，让云雀安稳停靠。）",speaker:"古树",text:"我明白了。孤独，不是世界抛弃了我。很多时候，是我们都困在「必须有某种特定陪伴」的念头里面。就算得不到理想中的那一种，细碎微弱的联结，同样能够抚慰人心。"},

   {id:"s14",type:"dialogue",narr:"（石壳小虫鼓起勇气顺着树根爬到低矮树枝；漂泊云雀落下，不再漫无目的地飞翔；土拨鼠也走出地洞，坐在树根泥土之上。荒原依旧辽阔，风沙依旧偶尔吹过，可是再也不是彻底死寂。新芽嫩绿，在灰蒙天地透出一点鲜活颜色。）",speaker:"古树",text:"我依旧会怀念曾经成片森林。遗憾不会彻底消失。但我不必再独自承担全部黑夜。"},

   {id:"end",type:"ending",text:"树长出了新芽。荒原的风，柔和了一些。"}],

  rewardSkin:"mint"},

 {id:"guilt",title:"自责",em:"🌊",summary:"珍珠贝里的潮汐精灵",bg:"柔和海湾，海面泛着朦胧银蓝色月光。巨大的闭合珍珠贝半埋在浅海沙滩，贝壳紧紧扣在一起，缝隙之中透出细碎珍珠微光。",

  steps:[

   {id:"s1",type:"dialogue",narr:"（小幽灵踩着浅浅浪花飘过来，海浪碰到幽灵的身体直接穿过去。巨大珍珠贝严丝合缝，听不到里面大声的歌唱，只有细碎压抑的呜咽，从贝壳缝隙飘出来。）",speaker:"小幽灵",text:"里面有人吗？可以听见我说话。"},

   {id:"s2",type:"dialogue",narr:"（贝壳没有打开，里面传来怯生生、带着哭腔的少女声音，那就是潮汐精灵。）",speaker:"潮汐精灵（贝壳内）",text:"请你走吧，不要靠近我。我是带来灾祸的精灵。"},

   {id:"s3",type:"dialogue",speaker:"潮汐精灵",text:"从前这片沼泽海湾水流混乱。我的歌声拥有调和潮水的力量。那时候，我常常放声歌唱，潮水顺着歌声安稳起落，沿岸村落的居民平安生活。所有人都喜欢听我的歌声。"},

   {id:"s4",type:"dialogue",speaker:"潮汐精灵",text:"那一天，我心里分神了。我心里在担忧一件无关潮水的小事，一瞬间走神，歌声彻底走调。汹涌洪水顺着海湾漫上岸，冲毁岸边不少小屋。虽然没有有人失去生命，但很多人的家受损。"},

   {id:"s5",type:"dialogue",speaker:"潮汐精灵",text:"那是我的错。是我分心，酿成灾难。从那天起，我关上贝壳，把自己锁在这里。我不配再歌唱，不配再看见外面世界。只要我永远封闭起来，我就再也不会伤害任何人。"},

   {id:"s6",type:"dialogue",speaker:"小幽灵",text:"洪水带来的破坏确确实实发生了。可是，这件事就等于「我本身是糟糕的存在」吗？"},

   {id:"s7",type:"dialogue",speaker:"潮汐精灵",text:"不是吗？能力在我手上，因为我的疏忽造成伤害，证明我很糟糕。只要我存在，就有可能再次犯错。最好的办法，就是永远把自己隔绝。"},

   {id:"s8",type:"dialogue",speaker:"小幽灵",text:"我想问问你。事发那一刻，你是故意想要毁坏村庄吗？"},

   {id:"s9",type:"dialogue",speaker:"潮汐精灵",text:"当然不是！我无比希望大家平安。仅仅是一瞬间的分心而已。可是伤害已经实实在在出现，意图又有什么意义？结果摆在眼前。",choices:[

     {label:"「做出一件错事」和「我整个人一无是处」是两回事",feedback:"贝壳里面安静下来，呜咽的声音减弱。",next:"s10"},

     {label:"先问问她：事情发生前，她希望什么",feedback:"「我希望大家平安……」精灵的声音低下去，「可结果不会因此改变。」",next:"s10"}]},

   {id:"s10",type:"dialogue",speaker:"小幽灵",text:"结果的存在，需要被看见。但「做出一件错事」和「我整个人一无是处」，是两件完全不一样的东西。一件行为，不能定义你的全部。犯错会带来后果，我们需要承担后果，但不需要用一辈子囚禁自己当作惩罚。当时洪水退去之后，岸边居民也慢慢重建家园。很多人其实明白，你并不是有心作恶。"},

   {id:"s11",type:"dialogue",speaker:"潮汐精灵",text:"可是我没有办法原谅我自己。每当我想张开贝壳，脑海就会不断回放洪水席卷海岸画面。我反复责怪当初那个走神的自己。"},

   {id:"s12",type:"dialogue",speaker:"小幽灵",text:"愧疚本身，代表你心里拥有善意。正是因为你十分在乎其他人，这件事才会如此折磨你。但愧疚可以用来提醒自己，不该用来永久审判自己。你不必强迫自己立刻放声高歌回到从前，不用一下子变回无所畏惧的样子。你可以先试着，把贝壳张开一条小小的缝。不用马上完全敞开。"},

   {id:"s13",type:"dialogue",narr:"（漫长沉默过后，巨大珍珠贝一点点松动。一道银白色缝隙慢慢扩大。潮汐精灵披着珍珠光泽的薄纱，怯生生从贝壳之中探出半边身子。她眉眼柔软，眼眶还有未擦干的泪光。）",speaker:"潮汐精灵",text:"……我依旧会为曾经发生的事情感到难过。那份后悔不会彻底消失。但是我不想再把自己永久关起来。我可以慢慢来。我可以小声哼唱，不必强求歌声立刻完美掌控潮水。"},

   {id:"s14",type:"dialogue",narr:"（她轻轻哼起一段极轻柔的调子。海面潮水变得温顺柔和。没有盛大激昂的咏唱，只有淡淡的、舒缓旋律。）",speaker:"潮汐精灵",text:"原来修复，不是抹去过去犯下的失误。而是学会带着愧疚继续往前走。我造成过影响，可这不代表我整个人都一文不值。"},

   {id:"end",type:"ending",text:"珍珠贝缓缓敞开，里面躺着一颗温润的珍珠。"}],

  rewardSkin:"pearl"},

 {id:"burnout",title:"倦怠",em:"🔥",summary:"熄灭的余火",bg:"安静的火山谷地。没有滚烫熔岩，到处是冷却的黑色火山岩。谷地正中央，一堆篝火已经几乎完全熄灭，只剩一点奄奄一息的微弱火星。",

  steps:[

   {id:"s1",type:"dialogue",narr:"（小幽灵缓缓飘入山谷。空气中没有灼热温度，只有一片沉沉的凉意。地上那团火焰几乎看不见光亮，只剩星星点点火星，奄奄一息。）",speaker:"熄灭的火焰",text:"你来了。不用靠近，我已经没有多余温度可以分给任何人。"},

   {id:"s2",type:"dialogue",speaker:"熄灭的火焰",text:"曾经，我是山谷之中熊熊燃烧的烈火。周围一切都需要我。寒冷小动物过来取暖，枯萎草木等待我带来新生的火种，路过旅人依靠我的光亮度过黑夜。"},

   {id:"s3",type:"dialogue",speaker:"熄灭的火焰",text:"所有人来找我索取温暖，索取光亮。我觉得，我的意义就是不停给予。如果我不再输出热量，我就没有存在价值。于是我不停燃烧，不停消耗自己。哪怕内部燃料已经快要耗尽，我依旧硬撑着释放光热。我不敢停下来休息。"},

   {id:"s4",type:"dialogue",speaker:"熄灭的火焰",text:"我担心，只要我减弱分毫，大家就会离开我。如果我不能持续付出，我就是没用的火焰。直到某一刻，燃料彻底耗尽。我就这样，猝不及防熄灭。"},

   {id:"s5",type:"dialogue",speaker:"小幽灵",text:"在你拼命燃烧的时候，有没有人问过你，你累不累？"},

   {id:"s6",type:"dialogue",speaker:"熄灭的火焰",text:"好像……没有。大家习惯接收我的温暖，默认我可以源源不断提供一切。而我自己，也认同这个想法。我觉得疲惫是软弱的表现。我不该喊累。就算内部已经空空如也，也必须咬牙坚持输出。"},

   {id:"s7",type:"dialogue",speaker:"小幽灵",text:"不停付出的你，很珍贵。但你的价值，不等于你能够输出多少东西。你的存在本身，就拥有意义，不是只有持续奉献才配被善待。"},

   {id:"s8",type:"dialogue",speaker:"熄灭的火焰",text:"可是，如果我不再给予，那我还剩下什么？如果我休息，需要我的生灵会遭遇寒冷怎么办？我是不是很自私？"},

   {id:"s9",type:"dialogue",speaker:"小幽灵",text:"休息不等于彻底抛弃所有人。耗尽自己之后，你反而什么都给不出。蜡烛如果烧尽，就再也无法照亮任何人。",choices:[

     {label:"不必两个极端：不必全力燃烧，也不必彻底消亡",feedback:"火苗微弱抖动。",next:"s10"},

     {label:"先说说你担心的事",feedback:"「一旦我放缓，一切就会崩塌。」火焰的声音颤了颤。",next:"s10"}]},

   {id:"s10",type:"dialogue",speaker:"小幽灵",text:"你可以选择缩小自己的任务范围。不用满足所有人全部期待。可以允许自己有一段时期，只照顾你自己。需要取暖的小动物，可以寻找别的阳光；旅人可以寻找别的光源。不是所有需求，都必须由你来全部承接。"},

   {id:"s11",type:"dialogue",speaker:"熄灭的火焰",text:"那……我可不可以，不要一下子变回熊熊烈火？我不想逼迫自己立刻恢复全盛状态。"},

   {id:"s12",type:"dialogue",speaker:"小幽灵",text:"当然可以。修复不等于一瞬间回到曾经光芒万丈。微光就足够了。"},

   {id:"s13",type:"dialogue",narr:"（一点点温热从灰烬底层重新升起。不是盛大冲天火光，只是一团安稳、柔和的橘黄色微光。它不再无节制向外倾泻热量，保留一部分能量留给自身。）",speaker:"熄灭的火焰",text:"我明白了。倦怠是身体送来的警报，不是懦弱。我不必把全部自我当做礼物，全部奉献出去。优先照顾自己，并不是自私。"},

   {id:"s14",type:"dialogue",narr:"（山谷不再灼热逼人，一团暖融融微光静静悬浮在黑石之间。有些小动物过来获取一点点温度，火焰也懂得适时收回力量。）",speaker:"熄灭的火焰",text:"我不再强迫自己不停燃烧。允许自己停歇，我才能长久地存在在这里。"},

   {id:"end",type:"ending",text:"火焰恢复了微光——不要求立刻旺盛，但它还在，这就够了。"}],

  rewardSkin:"ember"},

 {id:"anxiety",title:"焦虑",em:"🔔",summary:"风铃与无数钟表",bg:"风铃小镇。街道两旁挂满大大小小钟表，滴答滴答无数声音混杂在一起，嘈杂纷乱。无数岔路铺在小镇广场，每一条岔路通向看不清的远方。",

  steps:[

   {id:"s1",type:"dialogue",narr:"（无数钟表指针飞快转动，有的走得太快，有的停滞不动。小幽灵穿梭过交错街道，小镇的守护生灵风铃精灵，抱着一堆不停摇晃的钟摆，神色慌乱来回踱步。）",speaker:"风铃精灵",text:"又来了一个访客。你听听这些钟表的声音。许许多多未来，全部悬在这里。无数可能性压过来，我根本分不清哪一条道路才是正确。"},

   {id:"s2",type:"dialogue",speaker:"风铃精灵",text:"每一座钟表代表一个我担忧的未来。我会不停预想所有可能发生坏事。我害怕选错道路，害怕遍体鳞伤。我拼命思考，想要把一切隐患全部提前规避。我不断设想：万一失败怎么办？万一出现糟糕局面怎么办？"},

   {id:"s3",type:"dialogue",speaker:"风铃精灵",text:"我试图提前解决所有还没有发生的麻烦。我时时刻刻思虑未来，可越想，内心越慌乱。我被一大堆尚未发生的设想困住。这些担忧占据我全部心神，让我看不见当下。"},

   {id:"s4",type:"dialogue",speaker:"小幽灵",text:"你担忧的事情，全部都是已经实实在在发生了吗？"},

   {id:"s5",type:"dialogue",speaker:"风铃精灵",text:"还没有。但是它们「有可能」发生啊。只要存在可能性，我就应该提前警惕。如果我不去反复思考预案，等到灾难降临，我就毫无准备。"},

   {id:"s6",type:"dialogue",speaker:"小幽灵",text:"区分两件事：有些烦恼，是现在就可以动手行动的；还有一部分担忧，属于暂时没办法掌控、没办法立刻改变的未来。对于后者，反复设想最坏情况，并不能阻止坏事到来，只会不停消耗现在的你。"},

   {id:"s7",type:"dialogue",speaker:"风铃精灵",text:"可是我放不下。只要念头冒出来，我就忍不住一遍一遍推演各种糟糕结局。如果我不去想，就好像我在逃避责任。"},

   {id:"s8",type:"dialogue",speaker:"小幽灵",text:"担忧本身是本能，代表你想要好好面对生活。但不要把「预想风险」变成无休止内耗。我们可以把一堆乱糟糟担心拆开看一看。哪些是此刻就可以迈出一小步去处理；哪些事情，无论怎么焦虑，当下都无能为力。",choices:[

     {label:"陪她一起梳理头脑里的乱糟糟念头",feedback:"风铃精灵坐在广场台阶，闭上眼睛，梳理脑海纷乱念头。",next:"s9"},

     {label:"先问：哪些事是当下能迈出一小步的？",feedback:"风铃精灵想了想：「好像……只有眼前这一小段路。」",next:"s9"}]},

   {id:"s9",type:"dialogue",speaker:"风铃精灵",text:"比如，我害怕前路未知，害怕之后会遭遇挫折。可是未来会发生什么，很多不受我的掌控。我再怎么反复担忧，也不能直接确定结局。但我可以做一件很小的事：先选眼前任意一条小路，往前走短短一小段，不用一次性走到终点。"},

   {id:"s10",type:"dialogue",narr:"（它抬手，把一部分疯狂转动的钟表拨慢。那些对应遥远未知风险的时钟，不再疯狂飞速奔跑，维持平缓节奏。剩下少数时钟，对应当下可以着手处理的小事，保留清醒计时。纷乱交错的风铃，不再一齐疯狂响动，只有几串风铃随风轻轻发出清晰声响。嘈杂喧嚣褪去大半。）",speaker:"风铃精灵",text:"原来焦虑是头脑在努力预警危险。但预警不等于灾难已经来临。我不必为还没有到来的事情透支现在的心神。我不需要一次性解决全部未知，只需要完成眼前小小的一步就够。"},

   {id:"s11",type:"dialogue",narr:"（广场无数岔路依旧还在，未来依旧充满不确定性，可是笼罩小镇惶惶不安的浓雾消散大半，钟声恢复从容平和节奏。）",speaker:"风铃精灵",text:"未知不会彻底消失。但我不用被未知吓得寸步难行。"},

   {id:"end",type:"ending",text:"风铃镇的钟表不再互相催促，各自走着各自的节拍。"}],

  rewardSkin:"star"},

 {id:"numb",title:"麻木",em:"🥀",summary:"褪色的静谧花园",bg:"静谧花园。曾经这里繁花遍野，如今所有花朵褪掉色彩，只剩灰白、浅灰。花瓣软软垂落。听不到虫鸣，闻不到花香。一切安安静静，仿佛整个世界按下静音键。",

  steps:[

   {id:"s1",type:"dialogue",narr:"（小幽灵飘进花园。伸手触碰一朵花，花瓣毫无色彩。整个空间安静得近乎窒息。花园守护者花灵，呆呆站在花坛中间，眼神空洞，对外界几乎没有反应。）",speaker:"花灵",text:"……你来了。这里没有好看景色。所有颜色，好像都从我身上流走了。"},

   {id:"s2",type:"dialogue",speaker:"小幽灵",text:"花园为什么变成这样？"},

   {id:"s3",type:"dialogue",speaker:"花灵",text:"从前，这里花开四季。我会体会喜悦，也会体会悲伤。经历过一连串沉重伤痛之后，慢慢的，我的心拉起一层厚厚的帷幕。为了不再承受痛苦，我好像把全部感受都关掉了。"},

   {id:"s4",type:"dialogue",speaker:"花灵",text:"悲伤不会刺痛我，可是同样，开心、感动、温暖，我也感受不到。就好像活在一层厚厚的雾里面。什么情绪都感觉不到，既不难过，也不快乐。"},

   {id:"s5",type:"dialogue",speaker:"小幽灵",text:"这是你的内心开启的自我保护。当痛苦过于沉重的时候，心灵会暂时关上感知，不让你继续承受伤害。麻木不是你的过错，它是一种自保。只是保护的帷幕待得太久，连同美好的感受一并隔开。"},

   {id:"s6",type:"dialogue",speaker:"花灵",text:"有时候我希望自己可以重新拥有感受。可是我又害怕，如果帷幕掀开，那些很难受的痛苦会再一次狠狠击中我。我不知道该不该走出去。",choices:[

     {label:"不用一下扯开帷幕，从很轻很小的感官线索开始",feedback:"小幽灵陪着花灵站在花坛边。",next:"s7"},

     {label:"如果觉得难受，随时可以退回安全状态",feedback:"花灵轻轻点了点头。",next:"s7"}]},

   {id:"s7",type:"dialogue",speaker:"小幽灵",text:"我们不用一下子把帷幕全部扯开。不必逼迫自己立刻大哭或者大笑。我们可以从很轻很小的感官线索开始，感受一点点温度，一点点声音，一点点气息。可以随时停下，如果觉得难受，可以退回安全状态。试一试，感受风拂过皮肤的温度，听听微风穿过花枝细微沙沙声响。留意脚下泥土淡淡的气息。不需要强迫生出浓烈情绪，仅仅只是观察就可以。不用评判自己「应该有什么感觉」。"},

   {id:"s8",type:"dialogue",narr:"（花灵慢慢深呼吸，集中注意力。一阵微风掠过花园。第一朵小花，花瓣边缘，重新晕开极淡一层粉。不是瞬间姹紫嫣红满园盛放，仅仅一丝浅浅色彩。）",speaker:"花灵",text:"……我好像，感受到风的凉意了。很淡，但是真实存在。我还以为我再也体会不到任何东西。"},

   {id:"s9",type:"dialogue",speaker:"小幽灵",text:"从麻木中恢复，不是一瞬间轰轰烈烈。色彩会一点点回来，中间依旧会夹杂难受时刻。允许过程缓慢，可以随时停下来休息，不用逼迫自己快速「好起来」。"},

   {id:"s10",type:"dialogue",narr:"（一朵接一朵，花朵慢慢染上浅浅的颜色。不会立刻回到往日全盛绚烂，灰白依旧大面积存在，但星星点点鲜活色彩散落在花园各处。有微弱的风声，细碎花叶响动。）",speaker:"花灵",text:"原来麻木是心灵的缓冲罩。它保护我熬过最难熬阶段。现在，我可以一点点，慢慢把感知找回来。不必急，慢慢来就可以。就算有些感受是痛苦，我也有能力一点点承接。"},

   {id:"end",type:"ending",text:"花园恢复了一点点色彩——只有一点点，但确实是颜色。"}],

  rewardSkin:"garden"},

 {id:"helpless",title:"无助",em:"🌉",summary:"断裂的雾谷之桥",bg:"浓雾弥漫的雾谷。一道幽深峡谷横亘面前，通往对岸的石桥从中断裂，巨大缺口横亘在峡谷中间，底下云雾翻滚。",

  steps:[

   {id:"s1",type:"dialogue",narr:"（小幽灵穿过层层白雾，落在断桥残存的桥面。巨大裂缝阻断通行。桥灵坐在断桥残垣之上，垂头丧气。对岸隐约能看见美丽的原野，可是没有完整道路能够抵达。）",speaker:"桥灵",text:"这座桥，原本连通峡谷两岸。曾经无数生灵从我身上走过，去往对岸的土地。后来狂风暴雨席卷山谷，桥直接从中断裂。"},

   {id:"s2",type:"dialogue",speaker:"桥灵",text:"我拼命想要把断裂部分拼接回去。单凭我自己力量，无论怎么努力，都没有办法复原整座大桥。我试过耗尽全部力量修补，结果只会让自己越来越虚弱。"},

   {id:"s3",type:"dialogue",speaker:"桥灵",text:"看着对岸美好的风景，我心里充满无力感。我觉得一切只能就这样了。我什么都做不到。我既不能完全修复整座大桥，也没有办法把大家送到彼岸。好像所有努力全部没有意义。"},

   {id:"s4",type:"dialogue",speaker:"小幽灵",text:"你一心想要修好完整的大桥，想要一次性彻底解决全部问题。可是复原整座桥梁，单凭你一个，本就是过于沉重任务。"},

   {id:"s5",type:"dialogue",speaker:"桥灵",text:"难道就只能放弃，永远被困在此处？"},

   {id:"s6",type:"dialogue",speaker:"小幽灵",text:"有两种误区。第一种，认为我必须独立解决全部难题；第二种，如果不能一次性达成完美结局，那么做什么都毫无价值。或许，我们不需要立刻搭建完整横跨峡谷的大桥。我们可以先搭一小段，可以让人往前走一小步就够。同时，也可以寻找其他可以一起来出力的伙伴。"},

   {id:"s7",type:"dialogue",speaker:"桥灵",text:"找别人帮忙？可是我习惯凡事自己硬扛。求助，在我看来代表我很弱小，代表我失败。",choices:[

     {label:"求助不等于无能",feedback:"桥灵静静思索，看向断裂的桥梁。",next:"s8"},

     {label:"分清：什么是力所能及的一小步，什么需要别人支援",feedback:"桥灵低头看着脚下深不见底云雾峡谷，慢慢想。",next:"s8"}]},

   {id:"s8",type:"dialogue",speaker:"小幽灵",text:"人或者生灵的力量本就有限。承认自己单凭一己之力无法搞定全部，并不是缺点。你可以分清两件事：什么是我力所能及的一小步；什么部分，需要别人的支援。"},

   {id:"s9",type:"dialogue",speaker:"桥灵",text:"我没办法一瞬间补好全部巨大缺口。但是，我可以先加固脚下现存桥面，搭建出短短一小截新桥梁，让大家可以向前靠近峡谷中间。剩下遥远距离，我可以去呼唤山谷其他生灵，石头精灵、藤蔓精灵，请大家一起出力。"},

   {id:"s10",type:"dialogue",narr:"（浓雾微微散开。桥灵调动自己残存力量，石块一点点拼接，断桥之上，延伸出短短的一小段新桥。没有直达对岸，但是实实在在向前推进一大截。远处，藤蔓精灵与石精灵听见呼唤，穿过浓雾赶来，愿意共同参与修补工程。）",speaker:"桥灵",text:"我终于明白。无助感来自两件事：一是给自己定下一个单凭自己无法完成的完美目标；二是误以为所有重担必须独自背负。就算达不到最终终点，往前踏出一小步，同样有价值。向他人寻求支持，并不是软弱。"},

/* ================= 状态与存档 ================= */

const SAVE_KEY="melancholia_save_v1";

const defaultSave=()=>({

 schemaVersion:1,

 profile:{stage:null,pressureTopics:[],avatarVariant:"default",createdAt:Date.now()},

 onboardingComplete:false,introComplete:false,

 completedChapters:[],chapterProgress:{},

 completedRiverScenarios:[],riverProgress:{},

 unlockedSkins:["default"],unlockedAccessories:[],

 equipped:{skinId:"default",accessoryId:null},

 settings:{reducedMotion:false,textSpeed:"normal",soundEnabled:false},

});

let save=defaultSave();

function loadSave(){

 try{

  const raw=localStorage.getItem(SAVE_KEY);

  if(!raw)return;

  const data=JSON.parse(raw);

  if(data.schemaVersion!==1)return;

  save=Object.assign(defaultSave(),data);

 }catch(e){console.warn("存档损坏，使用新档");}

}

function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2400);}

function showModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modalMask").style.display="flex";}

function closeModal(){document.getElementById("modalMask").style.display="none";}

function el(tag,cls,html){const d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d;}

function ghostHTML(){

 const skin=SKINS[save.equipped.skinId]||SKINS.default;

 const a=save.equipped.accessoryId?ACCESSORIES[save.equipped.accessoryId]:null;

 return `<div class="ghost-avatar">

   <div class="ghost-body" style="background:radial-gradient(circle at 35% 30%, #fff8, ${skin.color})"></div>

   <div class="ghost-face">◦‿◦</div>

   ${a?`<span class="accessory-icon ${a.cls}">${a.icon}</span>`:""}

 </div>`;

}

const renderMap={

  welcome:renderWelcome,onboarding:renderOnboarding,prologue:renderPrologue,

  home:renderHome,story:renderStory,river:renderRiver,

  meditation:renderMeditation,wardrobe:renderWardrobe,settings:renderSettings,

};

function go(page,arg){

 const app=document.getElementById("app");

 app.innerHTML="";

 const renderFn=renderMap[page]||renderWelcome;

 app.appendChild(renderFn(arg));

 document.getElementById("navbar").style.display=

  ["welcome","onboarding","prologue"].includes(page)?"none":"flex";

 window.scrollTo(0,0);

}

 const hasSave=save.onboardingComplete;

 p.appendChild(el("h1",null,"忧郁大陆"));

 p.appendChild(el("p","sub","被六种情绪阴霾笼罩的大陆，<br>等待一位温柔的访客。<br><br><span class='small-note'>这是温和的情绪探索与自助练习游戏，<br>不提供诊断，也不能替代心理专业人员的帮助。</span>"));

 showModal(`<h2>开始新旅程？</h2><p class="small-note" style="margin:12px 0">当前存档将被覆盖，进度无法恢复。</p>

  <div class="btnrow"><button class="btn primary" onclick="save=defaultSave();persist();closeModal();go('onboarding')">确认重来</button>

  <button class="btn ghost" onclick="closeModal()">取消</button></div>`);

}

 riverState={S,stage:(prog&&prog.stage>1&&prog.stage<=5)?prog.stage:1,

  takenBubbles:[],pairs:{},evidence:[],selEvidence:[],selBalanced:false,selAction:null};

}

function riverCollect(hid){

 if(st&&!st.evidence.includes(hid)){

  st.evidence.push(hid);

  if(!save.unlockedAccessories.includes("pearl"))save.unlockedAccessories.push("pearl");

  persist();

 }

}

function finishRiver(){

 const st=riverState,S=st.S;

 if(firstTime){

  save.completedRiverScenarios.push(S.id);

  if(!save.unlockedAccessories.includes("scarf"))save.unlockedAccessories.push("scarf");

   if(!save.unlockedAccessories.includes("star"))save.unlockedAccessories.push("star");

 delete save.riverProgress[S.id];

 persist();

  if(has){const b=el("button","btn small",on?"卸下":"装备");

   b.onclick=()=>{save.equipped.accessoryId=on?null:id;persist();go("wardrobe");};it.appendChild(b);}

  p.appendChild(it);

 });

 return p;

}

/* ---- 设置 ---- */

function renderSettings(){

 const p=el("div","page active");

 p.appendChild(el("h2",null,"⚙️ 设置 / 存档"));

 const c=el("div","card");

 function toggle(label,key){

  const row=el("div","wardrobe-item");

  row.innerHTML=`<div style="flex:1">${label}</div>`;

  const b=el("button","btn small",save.settings[key]?"开":"关");

  b.onclick=()=>{save.settings[key]=!save.settings[key];applySettings();persist();go("settings");};

  row.appendChild(b);c.appendChild(row);

 }

 toggle("减少动画","reducedMotion");

 toggle("声音","soundEnabled");

 const spd=el("div","wardrobe-item");

 spd.innerHTML=`<div style="flex:1">文字速度</div>`;

 ["slow","normal","fast"].forEach(s=>{

  const b=el("button","btn small",s==="slow"?"慢":s==="normal"?"中":"快");

  if(save.settings.textSpeed===s)b.classList.add("primary");

  b.onclick=()=>{save.settings.textSpeed=s;persist();go("settings");};

  spd.appendChild(b);

 });

 c.appendChild(spd);

 p.appendChild(c);
  
 const cBgm=el("div","card");

 cBgm.innerHTML="<b>🎵 背景音乐</b><p class='small-note'>选择你本地的 MP3 文件作为背景音乐（仅本页使用，不会上传到任何地方）。<br>注意：受浏览器限制，文件不会跨刷新保留，刷新后需重新选择。</p>";

 const fileInput=document.createElement("input");

 fileInput.type="file";fileInput.accept="audio/*";

 fileInput.style.display="none";

 const pickB=el("button","btn small","选择本地 MP3 文件");

 pickB.onclick=()=>fileInput.click();

 fileInput.onchange=()=>{ if(fileInput.files&&fileInput.files[0]) loadBGM(fileInput.files[0]); };

 const playB=el("button","btn small","▶ 播放");

 playB.onclick=()=>{ if(bgmAudio){bgmAudio.play();toast("播放中 🎵");} else toast("请先选择一个音频文件"); };

 const pauseB=el("button","btn small","⏸ 暂停");

 pauseB.onclick=()=>{ if(bgmAudio){bgmAudio.pause();toast("已暂停");} else toast("还没有加载音乐"); };

 const stopB=el("button","btn small","⏹ 停止并清除");

 stopB.onclick=()=>{

  if(bgmAudio){bgmAudio.pause();bgmAudio.src="";bgmAudio=null;}

  fileInput.value="";

  save.settings.soundEnabled=false;persist();

  toast("音乐已停止并清除");

 };

 const volRow=el("div","wardrobe-item");

 volRow.innerHTML=`<div style="flex:1">音量</div>`;

 const vol=document.createElement("input");

 vol.type="range";vol.min="0";vol.max="100";vol.value=50;

 vol.oninput=()=>{ if(bgmAudio)bgmAudio.volume=vol.value/100; };

 vol.style.flex="2";

 volRow.appendChild(vol);

 const bgmRow=el("div",null);

 bgmRow.style.display="flex";bgmRow.style.flexWrap="wrap";bgmRow.style.gap="8px";

 [pickB,playB,pauseB,stopB].forEach(b=>bgmRow.appendChild(b));

 cBgm.appendChild(bgmRow);

 cBgm.appendChild(volRow);

 cBgm.appendChild(fileInput);

 p.appendChild(cBgm);
 const c2=el("div","card");

 c2.innerHTML="<b>存档</b><p class='small-note'>进度自动保存在本浏览器 localStorage。不上传任何数据。</p>";

 const exportB=el("button","btn small","导出存档 JSON");

 exportB.onclick=()=>{

  const data=JSON.stringify(save,null,2);

  showModal(`<h3>存档内容</h3><textarea style="width:100%;height:180px;margin:10px 0" readonly>${data}</textarea>

   <div class="btnrow"><button class="btn primary" onclick="closeModal()">关闭</button></div>`);

 };

 c2.appendChild(exportB);

 const clearB=el("button","btn small","清除本地存档");

 clearB.style.borderColor="var(--rose)";clearB.style.color="var(--rose)";

 clearB.onclick=()=>showModal(`<h2>确认清除？</h2><p class="small-note" style="margin:10px 0">所有进度将删除，且无法恢复。</p>

  <div class="btnrow"><button class="btn primary" style="background:var(--rose)" onclick="doClearSave()">确认清除</button>

  <button class="btn ghost" onclick="closeModal()">取消</button></div>`);

 c2.appendChild(clearB);

 p.appendChild(c2);

 const back=el("div","btnrow");

 const b=el("button","btn","返回主页");b.onclick=()=>go("home");back.appendChild(b);

 p.appendChild(back);

 return p;

}

function doClearSave(){

 try{localStorage.removeItem(SAVE_KEY);}catch(e){}

 save=defaultSave();medState=null;storyState=null;riverState=null;closeModal();go("welcome");

}

function applySettings(){

 document.body.classList.toggle("reduced-motion",!!save.settings.reducedMotion);

}

/* ---- 本地背景音乐 ---- */

let bgmAudio=null;

function loadBGM(file){

 try{

  if(bgmAudio){bgmAudio.pause();bgmAudio.src="";}

  bgmAudio=new Audio();

  bgmAudio.src=URL.createObjectURL(file);

  bgmAudio.loop=true;

  bgmAudio.volume=0.5;

  bgmAudio.play().then(()=>{

   save.settings.soundEnabled=true;persist();

   toast("背景音乐已开始播放 🎵");

  }).catch(()=>toast("浏览器阻止了自动播放，请再按一次播放按钮"));

 }catch(e){toast("无法加载该音频文件");}

}

 
  
/* ---- 启动 ---- */

loadSave();

applySettings();

go(save.onboardingComplete?"home":"welcome");

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW 注册失败", e));

  });

}

let deferredPrompt=null;

window.addEventListener("beforeinstallprompt", (e) => {

  e.preventDefault();

  deferredPrompt=e;

  showInstallButton();

});

function showInstallButton(){

  const bar=document.querySelector(".navbar");

  if(!bar||document.getElementById("installBtn"))return;

  const b=document.createElement("button");

  b.id="installBtn";b.className="btn small";b.textContent="📲 安装";

  b.onclick=async()=>{

    if(!deferredPrompt)return;

    deferredPrompt.prompt();

    await deferredPrompt.userChoice;

    deferredPrompt=null;b.remove();

  };

  bar.appendChild(b);

}

</script>

</body>

</html>
