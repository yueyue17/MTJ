<style>

:root{

  --radius:18px;

  --bg1:#fdf2e4;--bg2:#f8e2d4;--card:#fffaf2;--card2:#fdf0df;

  --ink:#5d4a3c;--sub:#a28a74;--mint:#7cc7a6;--gold:#dfae62;--rose:#e78d99;

  --accent:#e08d9f;--primary1:#f2a3ae;--primary2:#f7c69c;

  --navbg:rgba(255,250,241,.92);--border:#f2ddc6;--shadow:0 8px 22px rgba(216,166,124,.16);

  --ghostInk:#6b5a68;--blush:#f2a0aa;--bubInk:#6d4148;

}

html[data-theme="bw"]{--bg1:#ffffff;--bg2:#f4f4f4;--card:#ffffff;--card2:#f5f5f5;--ink:#1a1a1a;--sub:#6b6b6b;--mint:#4a4a4a;--gold:#3d3d3d;--rose:#555;--accent:#222;--primary1:#3a3a3a;--primary2:#5c5c5c;--navbg:rgba(255,255,255,.95);--border:#ddd;--shadow:0 8px 22px rgba(0,0,0,.12);--ghostInk:#111;--blush:#c9c9c9;--bubInk:#ffffff}

html[data-theme="green"]{--bg1:#eaf5e7;--bg2:#d8ecd3;--card:#fcfffa;--card2:#edf7ea;--ink:#31503a;--sub:#7f9c84;--mint:#5fad80;--gold:#c7a568;--rose:#d98f92;--accent:#5fad80;--primary1:#8fc8a4;--primary2:#c2e0bd;--navbg:rgba(250,255,248,.92);--border:#cfe6cb;--shadow:0 8px 22px rgba(120,170,130,.18);--ghostInk:#3f5a47;--blush:#efb2ac;--bubInk:#2f4f3b}

html[data-theme="redwhite"]{--bg1:#fdf0f1;--bg2:#f9dde1;--card:#fffbfb;--card2:#fceef0;--ink:#5c393f;--sub:#b18a8e;--mint:#82c6a8;--gold:#dfa26b;--rose:#d95c6b;--accent:#d95c6b;--primary1:#ec8f99;--primary2:#f5bcae;--navbg:rgba(255,250,250,.94);--border:#f5d3d7;--shadow:0 8px 22px rgba(217,120,130,.16);--ghostInk:#6e434a;--blush:#f0a4a4;--bubInk:#6b3a42}

html[data-theme="bluewhite"]{--bg1:#edf5fd;--bg2:#dcebfd;--card:#fbfdff;--card2:#e9f2fc;--ink:#39527a;--sub:#85a1c2;--mint:#7fc2c9;--gold:#d8b06e;--rose:#dc8f9b;--accent:#6ba0d9;--primary1:#90bae7;--primary2:#bdd8f3;--navbg:rgba(250,252,255,.94);--border:#d2e3f5;--shadow:0 8px 22px rgba(110,150,200,.18);--ghostInk:#44598a;--blush:#f0a8b4;--bubInk:#33517d}

*{box-sizing:border-box;margin:0;padding:0}

html{min-height:100%;background:linear-gradient(165deg,var(--bg1),var(--bg2)) fixed;transition:background .4s}

body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);min-height:100vh}

#bgLayer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:0;transition:opacity .5s}

body.has-bg #bgLayer{opacity:1}

body.has-bg #bgLayer::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg1) 58%,transparent),color-mix(in srgb,var(--bg2) 78%,transparent))}

#app{max-width:720px;margin:0 auto;padding:16px 16px 90px;min-height:100vh;display:flex;flex-direction:column}

.page{display:none;flex:1;flex-direction:column;animation:fadein .35s ease}

.page.active{display:flex}

@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

body.reduced-motion *{animation:none!important;transition:none!important}

h1{font-size:1.9rem;letter-spacing:.16em;text-align:center;margin:42px 0 10px}

h1::before{content:"✦ ";color:var(--gold)}

h1::after{content:" ✦";color:var(--gold)}

h2{font-size:1.25rem;margin:8px 0 14px}

p.sub{color:var(--sub);text-align:center;line-height:1.8}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin:10px 0;box-shadow:var(--shadow)}

.btn{display:inline-block;border:1px solid var(--border);cursor:pointer;font-size:1rem;background:var(--card2);color:var(--ink);padding:12px 20px;border-radius:14px;min-height:48px;transition:transform .12s,background .2s,box-shadow .2s;font-family:inherit;box-shadow:0 3px 8px rgba(150,110,70,.08)}

.btn:hover{transform:translateY(-1px)}

.btn:active{transform:scale(.97)}

.btn.primary{background:linear-gradient(120deg,var(--primary1),var(--primary2));color:#fff;border:none;box-shadow:0 6px 16px rgba(0,0,0,.12)}

.btn.ghost{background:transparent;border:1.5px solid var(--accent);color:var(--accent);box-shadow:none}

.btn.small{padding:8px 14px;min-height:40px;font-size:.9rem}

.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0}

.chip{display:inline-block;background:var(--card2);border:2px solid transparent;border-radius:20px;padding:9px 16px;margin:5px;cursor:pointer;font-size:.95rem;transition:border-color .15s;user-select:none}

.chip.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card2))}

.ghost-avatar{width:150px;height:165px;margin:18px auto;position:relative}

.ghost-stage{width:240px;height:255px;margin:8px auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

.ghost-avatar svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 10px 16px rgba(130,90,60,.18));animation:float 3.6s ease-in-out infinite}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.acc-img{position:absolute;transform:translate(-50%,-50%);z-index:2;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(100,70,40,.25))}

.ghost-stage .acc-img{pointer-events:auto;cursor:grab}

.ghost-stage .acc-img.sel{cursor:grab;filter:drop-shadow(0 0 7px var(--accent)) drop-shadow(0 3px 5px rgba(100,70,40,.25))}

.ghost-stage.dragging .acc-img.sel{cursor:grabbing}

.map-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}

.map-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px;cursor:pointer;text-align:center;transition:border-color .15s,transform .15s;box-shadow:var(--shadow)}

.map-card:hover{border-color:var(--accent);transform:translateY(-2px)}

.map-card .em{font-size:1.8rem}

.map-card .t{margin-top:6px;font-weight:600}

.map-card .s{font-size:.78rem;color:var(--sub);margin-top:4px}

.map-card.done{border-color:var(--mint)}

.chat-list{display:flex;flex-direction:column;gap:10px;margin:12px 0}

.msg{max-width:88%;padding:12px 15px;border-radius:16px;line-height:1.8;font-size:.97rem;animation:msgin var(--msgdur,.35s) ease both;word-break:break-word;box-shadow:0 3px 10px rgba(150,110,70,.1)}

@keyframes msgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

body[data-textspeed="slow"] .msg{--msgdur:.7s}

body[data-textspeed="fast"] .msg{--msgdur:.12s}

.msg.other{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--spk,var(--accent));border-radius:4px 18px 18px 18px}

.msg.ghost{align-self:flex-end;background:linear-gradient(120deg,var(--primary1),var(--primary2));color:var(--bubInk);border-radius:18px 4px 18px 18px;box-shadow:0 4px 12px rgba(0,0,0,.1)}

.msg-name{font-size:.8rem;font-weight:700;color:var(--spk,var(--accent));margin-bottom:4px;letter-spacing:.06em}

.msg.ghost .msg-name{color:var(--bubInk);opacity:.85}

.msg.narr{align-self:center;background:transparent;border:1px dashed var(--border);color:var(--sub);font-size:.85rem;box-shadow:none;border-radius:12px;text-align:center;max-width:96%}

.scene-note{font-size:.85rem;color:var(--sub);line-height:1.7;background:color-mix(in srgb,var(--card) 62%,transparent);border:1px dashed var(--border);border-radius:14px;padding:10px 14px;margin:8px 0}

.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}

.progressbar{height:8px;background:var(--card2);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin:12px 0}

.progressbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--primary1));width:0;transition:width .4s}

.stage-tip{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;line-height:1.7;font-size:.93rem;margin:8px 0}

.stage-steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

.stage-step{font-size:.75rem;padding:4px 10px;border-radius:12px;background:var(--card2);border:1px solid var(--border);color:var(--sub)}

.stage-step.on{background:color-mix(in srgb,var(--accent) 16%,var(--card2));color:var(--ink);border-color:var(--accent)}

.stage-step.done{color:var(--mint);border-color:var(--mint)}

.bubble{position:absolute;padding:10px 16px;border-radius:40px;background:color-mix(in srgb,var(--card) 82%,transparent);border:1.5px solid var(--border);color:var(--ink);cursor:pointer;animation:bob 3s ease-in-out infinite;user-select:none;max-width:62%}

.bubble.taken{background:color-mix(in srgb,var(--mint) 30%,var(--card));border-color:var(--mint)}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.bubble-area{position:relative;height:240px;background:color-mix(in srgb,var(--card2) 70%,transparent);border:1px dashed var(--border);border-radius:var(--radius);overflow:hidden}

.hotspot{position:absolute;width:56px;height:56px;border-radius:50%;cursor:pointer;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 55%,transparent),color-mix(in srgb,var(--gold) 8%,transparent));border:2px dashed var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.4rem}

.hotspot.got{border-style:solid;background:color-mix(in srgb,var(--mint) 40%,transparent)}

.scene{position:relative;height:250px;background:color-mix(in srgb,var(--card2) 70%,transparent);border:1px dashed var(--border);border-radius:var(--radius);overflow:hidden}

.match-board{position:relative;display:flex;gap:14px;margin:12px 0}

.match-col{flex:1;display:flex;flex-direction:column;gap:10px;z-index:1}

.match-item{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:11px 12px;cursor:pointer;line-height:1.6;font-size:.92rem;transition:border-color .15s,box-shadow .15s;min-height:44px}

.match-item.belief{background:var(--card2)}

.match-item.pick{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}

.match-item.linked{border-color:var(--mint)}

.match-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

.match-lines path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;opacity:.85}

.match-lines circle{fill:var(--accent)}

.pair-chip{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:6px 10px;margin:4px 4px 0 0;font-size:.82rem;color:var(--sub);line-height:1.6}

.ref-card{border:1.5px dashed var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--card));border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.75}

.ref-card .ref-tag{font-size:.75rem;color:var(--gold);font-weight:700;display:block;margin-bottom:4px}

.hint-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:.88rem;color:var(--sub);line-height:1.65}

.evidence-card,.belief-card,.action-card{background:var(--card2);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s;line-height:1.6;margin:8px 0}

.evidence-card.sel,.belief-card.sel,.action-card.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card2))}

.breath-circle{width:160px;height:160px;border-radius:50%;margin:24px auto;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,#ffffff 40%,transparent),color-mix(in srgb,var(--mint) 22%,transparent));display:flex;align-items:center;justify-content:center;font-size:1.1rem;animation:breathe 8s ease-in-out infinite;text-align:center;line-height:1.6}

@keyframes breathe{0%,100%{transform:scale(.85)}45%{transform:scale(1.12)}55%{transform:scale(1.12)}}

.modal-mask{position:fixed;inset:0;background:rgba(30,20,15,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}

.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:420px;width:100%;text-align:center;animation:pop .3s ease;max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)}

@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

.reward-icon{font-size:3.2rem;margin:10px 0;animation:float 2.5s ease-in-out infinite}

.wardrobe-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--card2);border:1px solid var(--border);margin:8px 0}

.wardrobe-item.locked{opacity:.55}

.wardrobe-item .preview{width:56px;height:56px;flex-shrink:0;border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--card) 70%,transparent)}

.navbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:10px;background:var(--navbg);backdrop-filter:blur(10px);border-top:1px solid var(--border);z-index:40}

.navbar .btn{min-width:64px;box-shadow:none}

.tag{font-size:.75rem;padding:2px 8px;border-radius:10px;background:color-mix(in srgb,var(--ink) 10%,transparent)}

.tag.ok{color:var(--mint)}

.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--rose);padding:10px 18px;border-radius:12px;z-index:60;display:none;max-width:90%;box-shadow:var(--shadow)}

.small-note{font-size:.8rem;color:var(--sub);line-height:1.6}

.theme-dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:1px solid rgba(0,0,0,.12)}

.css-input{width:100%;min-height:120px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px;font-family:Consolas,monospace;font-size:.85rem;color:var(--ink);resize:vertical}

.bg-preview{width:100%;height:90px;border-radius:12px;border:1px solid var(--border);background-size:cover;background-position:center;margin:8px 0;background-color:var(--card2)}

.ghost-stage .acc-img.sel{cursor:grab;outline:2px dashed var(--accent);outline-offset:4px;border-radius:10px;filter:drop-shadow(0 0 8px var(--accent)) drop-shadow(0 3px 5px rgba(100,70,40,.25))}

.sel-hint{text-align:center;margin:2px 0 0;color:var(--sub)}

.prologue-tap{text-align:center;color:var(--sub);font-size:.9rem;padding:14px 10px 4px;cursor:pointer;user-select:none;-webkit-user-select:none;animation:tapPulse 1.8s ease-in-out infinite}

@keyframes tapPulse{0%,100%{opacity:.5}50%{opacity:1}}

@media (max-width:480px){h1{font-size:1.5rem}.match-item{font-size:.85rem;padding:9px 10px}.msg{max-width:92%}}

</style>

</head>

</div>

 {id:"loneliness",title:"孤独",em:"🌲",summary:"荒原上最后一棵树",bg:"无边荒原，风沙轻轻拂过枯黄地面。天地是灰蒙蒙的浅灰蓝，旷野只有孤零零一棵高大古树伫立。",

  steps:[

   {id:"s1",type:"dialogue",narr:"（小幽灵轻飘飘降落，双脚没有触碰尘土，飘到古树的枝干旁。古树的树干布满深深浅浅裂纹，风穿过枯枝，发出呜呜的、像叹气一样的声响。）",speaker:"古树",text:"……又有路过的风吗。"},

   {id:"s2",type:"dialogue",speaker:"小幽灵",text:"大树，你看起来好寂寞。这片荒原，只有你一个吗？"},

   {id:"s3",type:"dialogue",speaker:"古树",text:"很久以前，这里有成片树林。伙伴们一棵接一棵枯萎离开。到现在，只剩下我。我每天站在这里，看风沙来，看落日走。好像我生来就该独自守着这片空空荡荡的荒原。"},

   {id:"s4",type:"dialogue",speaker:"古树",text:"有时候我会想，是不是我本身不够好，所以才没有别的树木愿意留下来陪我。"},

   {id:"s5",type:"dialogue",narr:"（不远处，背着厚重石壳的小虫慢慢爬过来，壳上沾满细细黄沙。）",speaker:"石壳小虫",text:"大树又在自言自语啦。我每天都会路过这里，只是我体型太小，大树总看不见我。"},

   {id:"s6",type:"dialogue",speaker:"石壳小虫",text:"我总觉得，我这么渺小，我的陪伴没有意义。大树那么高大，它需要的应该是另一棵大树，不是一只微不足道的小虫。我怕我的靠近，对它来说不算陪伴。",choices:[

     {label:"你的靠近，对大树来说一定有意义",feedback:"小虫缩进自己石壳，沉默蹲坐在树根边。",next:"s7"},

     {label:"先听听云雀和土拨鼠怎么说",feedback:"小虫点点头，安静地退到一旁。",next:"s7"}]},

   {id:"s7",type:"dialogue",narr:"（天空掠过一只云雀，盘旋一圈落在干枯树枝，翅膀羽毛暗淡，它总是不停飞来飞去。）",speaker:"漂泊云雀",text:"我不停到处飞，去过很多很远的地方。可无论飞到哪里，心里空空的感觉消不掉。我以为只要不停赶路，就不会感受到孤单。"},

   {id:"s8",type:"dialogue",speaker:"漂泊云雀",text:"不是的。飞得再远，如果没有人分享看见的晚霞，再美的风景也只是风景。我害怕停下来，一旦停下，就必须直面心里空荡荡的感受。"},

   {id:"s9",type:"dialogue",narr:"（地面的土拨鼠从土洞探出圆滚滚脑袋，怯生生张望。）",speaker:"土拨鼠",text:"我住在地下洞穴里。我很想靠近大树，可是我很害怕主动。我总在等别人先来找我。如果没有人走向我，那我就安安静静待在洞里就好了。至少，就不会体会被拒绝的难受。"},

   {id:"s10",type:"dialogue",speaker:"小幽灵",text:"大树，我和这里的小伙伴聊过了。孤独不一定代表身边完全没有生命。小虫每天都来树根下歇脚；云雀常常飞回你的枝头；土拨鼠在地下，一直远远望着你。只是大家全都误以为，只有同等强大、同等模样的伙伴，才算真正陪伴。"},

   {id:"s11",type:"dialogue",speaker:"古树",text:"可是……它们都不是树。我想要同类。",choices:[

     {label:"陪伴有很多模样，不一定要一模一样",feedback:"古树沉默了很久，呼啸风沙慢慢放缓。",next:"s12"},

     {label:"如果伸出枝干，会不会被忽视呢？",feedback:"「会有这种可能性。」小幽灵轻轻说，「但如果一直封闭自己，就完全没有机会感受暖意。」",next:"s12"}]},

   {id:"s12",type:"dialogue",speaker:"小幽灵",text:"小虫可以和你讲地下泥土的故事；云雀可以把远方山谷的消息带回来；土拨鼠会告诉你春雨什么时候快要降临。陪伴，不是填补全部空缺，只是愿意分出一点点时间，看见彼此的存在。你不必强迫自己立刻变得热闹，只需要，轻轻伸出一截枝条就够了。"},

   {id:"s13",type:"dialogue",narr:"（古树缓缓调动残存力量，一根细嫩崭新的新芽，从苍老树干侧边慢慢钻出来。它把低垂的枝条放低一点，刚好能够让小虫爬到枝干，让云雀安稳停靠。）",speaker:"古树",text:"我明白了。孤独，不是世界抛弃了我。很多时候，是我们都困在「必须有某种特定陪伴」的念头里面。就算得不到理想中的那一种，细碎微弱的联结，同样能够抚慰人心。"},

   {id:"s14",type:"dialogue",narr:"（石壳小虫鼓起勇气顺着树根爬到低矮树枝；漂泊云雀落下，不再漫无目的地飞翔；土拨鼠也走出地洞，坐在树根泥土之上。荒原依旧辽阔，风沙依旧偶尔吹过，可是再也不是彻底死寂。新芽嫩绿，在灰蒙天地透出一点鲜活颜色。）",speaker:"古树",text:"我依旧会怀念曾经成片森林。遗憾不会彻底消失。但我不必再独自承担全部黑夜。"},

   {id:"end",type:"ending",text:"树长出了新芽。荒原的风，柔和了一些。"}],

  rewardSkin:"mint"},

 {id:"guilt",title:"自责",em:"🌊",summary:"珍珠贝里的潮汐精灵",bg:"柔和海湾，海面泛着朦胧银蓝色月光。巨大的闭合珍珠贝半埋在浅海沙滩，贝壳紧紧扣在一起，缝隙之中透出细碎珍珠微光。",

  steps:[

   {id:"s1",type:"dialogue",narr:"（小幽灵踩着浅浅浪花飘过来，海浪碰到幽灵的身体直接穿过去。巨大珍珠贝严丝合缝，听不到里面大声的歌唱，只有细碎压抑的呜咽，从贝壳缝隙飘出来。）",speaker:"小幽灵",text:"里面有人吗？可以听见我说话。"},

   {id:"s2",type:"dialogue",narr:"（贝壳没有打开，里面传来怯生生、带着哭腔的少女声音，那就是潮汐精灵。）",speaker:"潮汐精灵（贝壳内）",text:"请你走吧，不要靠近我。我是带来灾祸的精灵。"},

   {id:"s3",type:"dialogue",speaker:"潮汐精灵",text:"从前这片沼泽海湾水流混乱。我的歌声拥有调和潮水的力量。那时候，我常常放声歌唱，潮水顺着歌声安稳起落，沿岸村落的居民平安生活。所有人都喜欢听我的歌声。"},

   {id:"s4",type:"dialogue",speaker:"潮汐精灵",text:"那一天，我心里分神了。我心里在担忧一件无关潮水的小事，一瞬间走神，歌声彻底走调。汹涌洪水顺着海湾漫上岸，冲毁岸边不少小屋。虽然没有有人失去生命，但很多人的家受损。"},

   {id:"s5",type:"dialogue",speaker:"潮汐精灵",text:"那是我的错。是我分心，酿成灾难。从那天起，我关上贝壳，把自己锁在这里。我不配再歌唱，不配再看见外面世界。只要我永远封闭起来，我就再也不会伤害任何人。"},

   {id:"s6",type:"dialogue",speaker:"小幽灵",text:"洪水带来的破坏确确实实发生了。可是，这件事就等于「我本身是糟糕的存在」吗？"},

   {id:"s7",type:"dialogue",speaker:"潮汐精灵",text:"不是吗？能力在我手上，因为我的疏忽造成伤害，证明我很糟糕。只要我存在，就有可能再次犯错。最好的办法，就是永远把自己隔绝。"},

   {id:"s8",type:"dialogue",speaker:"小幽灵",text:"我想问问你。事发那一刻，你是故意想要毁坏村庄吗？"},

   {id:"s9",type:"dialogue",speaker:"潮汐精灵",text:"当然不是！我无比希望大家平安。仅仅是一瞬间的分心而已。可是伤害已经实实在在出现，意图又有什么意义？结果摆在眼前。",choices:[

     {label:"「做出一件错事」和「我整个人一无是处」是两回事",feedback:"贝壳里面安静下来，呜咽的声音减弱。",next:"s10"},

     {label:"先问问她：事情发生前，她希望什么",feedback:"「我希望大家平安……」精灵的声音低下去，「可结果不会因此改变。」",next:"s10"}]},

   {id:"s10",type:"dialogue",speaker:"小幽灵",text:"结果的存在，需要被看见。但「做出一件错事」和「我整个人一无是处」，是两件完全不一样的东西。一件行为，不能定义你的全部。犯错会带来后果，我们需要承担后果，但不需要用一辈子囚禁自己当作惩罚。当时洪水退去之后，岸边居民也慢慢重建家园。很多人其实明白，你并不是有心作恶。"},

   {id:"s11",type:"dialogue",speaker:"潮汐精灵",text:"可是我没有办法原谅我自己。每当我想张开贝壳，脑海就会不断回放洪水席卷海岸画面。我反复责怪当初那个走神的自己。"},

   {id:"s12",type:"dialogue",speaker:"小幽灵",text:"愧疚本身，代表你心里拥有善意。正是因为你十分在乎其他人，这件事才会如此折磨你。但愧疚可以用来提醒自己，不该用来永久审判自己。你不必强迫自己立刻放声高歌回到从前，不用一下子变回无所畏惧的样子。你可以先试着，把贝壳张开一条小小的缝。不用马上完全敞开。"},

   {id:"s13",type:"dialogue",narr:"（漫长沉默过后，巨大珍珠贝一点点松动。一道银白色缝隙慢慢扩大。潮汐精灵披着珍珠光泽的薄纱，怯生生从贝壳之中探出半边身子。她眉眼柔软，眼眶还有未擦干的泪光。）",speaker:"潮汐精灵",text:"……我依旧会为曾经发生的事情感到难过。那份后悔不会彻底消失。但是我不想再把自己永久关起来。我可以慢慢来。我可以小声哼唱，不必强求歌声立刻完美掌控潮水。"},

   {id:"s14",type:"dialogue",narr:"（她轻轻哼起一段极轻柔的调子。海面潮水变得温顺柔和。没有盛大激昂的咏唱，只有淡淡的、舒缓旋律。）",speaker:"潮汐精灵",text:"原来修复，不是抹去过去犯下的失误。而是学会带着愧疚继续往前走。我造成过影响，可这不代表我整个人都一文不值。"},

   {id:"end",type:"ending",text:"珍珠贝缓缓敞开，里面躺着一颗温润的珍珠。"}],

  rewardSkin:"pearl"},

 {id:"burnout",title:"倦怠",em:"🔥",summary:"熄灭的余火",bg:"安静的火山谷地。没有滚烫熔岩，到处是冷却的黑色火山岩。谷地正中央，一堆篝火已经几乎完全熄灭，只剩一点奄奄一息的微弱火星。",

  steps:[

   {id:"s1",type:"dialogue",narr:"（小幽灵缓缓飘入山谷。空气中没有灼热温度，只有一片沉沉的凉意。地上那团火焰几乎看不见光亮，只剩星星点点火星，奄奄一息。）",speaker:"熄灭的火焰",text:"你来了。不用靠近，我已经没有多余温度可以分给任何人。"},

   {id:"s2",type:"dialogue",speaker:"熄灭的火焰",text:"曾经，我是山谷之中熊熊燃烧的烈火。周围一切都需要我。寒冷小动物过来取暖，枯萎草木等待我带来新生的火种，路过旅人依靠我的光亮度过黑夜。"},

   {id:"s3",type:"dialogue",speaker:"熄灭的火焰",text:"所有人来找我索取温暖，索取光亮。我觉得，我的意义就是不停给予。如果我不再输出热量，我就没有存在价值。于是我不停燃烧，不停消耗自己。哪怕内部燃料已经快要耗尽，我依旧硬撑着释放光热。我不敢停下来休息。"},

   {id:"s4",type:"dialogue",speaker:"熄灭的火焰",text:"我担心，只要我减弱分毫，大家就会离开我。如果我不能持续付出，我就是没用的火焰。直到某一刻，燃料彻底耗尽。我就这样，猝不及防熄灭。"},

   {id:"s5",type:"dialogue",speaker:"小幽灵",text:"在你拼命燃烧的时候，有没有人问过你，你累不累？"},

   {id:"s6",type:"dialogue",speaker:"熄灭的火焰",text:"好像……没有。大家习惯接收我的温暖，默认我可以源源不断提供一切。而我自己，也认同这个想法。我觉得疲惫是软弱的表现。我不该喊累。就算内部已经空空如也，也必须咬牙坚持输出。"},

   {id:"s7",type:"dialogue",speaker:"小幽灵",text:"不停付出的你，很珍贵。但你的价值，不等于你能够输出多少东西。你的存在本身，就拥有意义，不是只有持续奉献才配被善待。"},

   {id:"s8",type:"dialogue",speaker:"熄灭的火焰",text:"可是，如果我不再给予，那我还剩下什么？如果我休息，需要我的生灵会遭遇寒冷怎么办？我是不是很自私？"},

   {id:"s9",type:"dialogue",speaker:"小幽灵",text:"休息不等于彻底抛弃所有人。耗尽自己之后，你反而什么都给不出。蜡烛如果烧尽，就再也无法照亮任何人。",choices:[

     {label:"不必两个极端：不必全力燃烧，也不必彻底消亡",feedback:"火苗微弱抖动。",next:"s10"},

     {label:"先说说你担心的事",feedback:"「一旦我放缓，一切就会崩塌。」火焰的声音颤了颤。",next:"s10"}]},

   {id:"s10",type:"dialogue",speaker:"小幽灵",text:"你可以选择缩小自己的任务范围。不用满足所有人全部期待。可以允许自己有一段时期，只照顾你自己。需要取暖的小动物，可以寻找别的阳光；旅人可以寻找别的光源。不是所有需求，都必须由你来全部承接。"},

   {id:"s11",type:"dialogue",speaker:"熄灭的火焰",text:"那……我可不可以，不要一下子变回熊熊烈火？我不想逼迫自己立刻恢复全盛状态。"},

   {id:"s12",type:"dialogue",speaker:"小幽灵",text:"当然可以。修复不等于一瞬间回到曾经光芒万丈。微光就足够了。"},

   {id:"s13",type:"dialogue",narr:"（一点点温热从灰烬底层重新升起。不是盛大冲天火光，只是一团安稳、柔和的橘黄色微光。它不再无节制向外倾泻热量，保留一部分能量留给自身。）",speaker:"熄灭的火焰",text:"我明白了。倦怠是身体送来的警报，不是懦弱。我不必把全部自我当做礼物，全部奉献出去。优先照顾自己，并不是自私。"},

   {id:"s14",type:"dialogue",narr:"（山谷不再灼热逼人，一团暖融融微光静静悬浮在黑石之间。有些小动物过来获取一点点温度，火焰也懂得适时收回力量。）",speaker:"熄灭的火焰",text:"我不再强迫自己不停燃烧。允许自己停歇，我才能长久地存在在这里。"},

   {id:"end",type:"ending",text:"火焰恢复了微光——不要求立刻旺盛，但它还在，这就够了。"}],

  rewardSkin:"ember"},

 {id:"anxiety",title:"焦虑",em:"🔔",summary:"风铃与无数钟表",bg:"风铃小镇。街道两旁挂满大大小小钟表，滴答滴答无数声音混杂在一起，嘈杂纷乱。无数岔路铺在小镇广场，每一条岔路通向看不清的远方。",

  steps:[

   {id:"s1",type:"dialogue",narr:"（无数钟表指针飞快转动，有的走得太快，有的停滞不动。小幽灵穿梭过交错街道，小镇的守护生灵风铃精灵，抱着一堆不停摇晃的钟摆，神色慌乱来回踱步。）",speaker:"风铃精灵",text:"又来了一个访客。你听听这些钟表的声音。许许多多未来，全部悬在这里。无数可能性压过来，我根本分不清哪一条道路才是正确。"},

   {id:"s2",type:"dialogue",speaker:"风铃精灵",text:"每一座钟表代表一个我担忧的未来。我会不停预想所有可能发生坏事。我害怕选错道路，害怕遍体鳞伤。我拼命思考，想要把一切隐患全部提前规避。我不断设想：万一失败怎么办？万一出现糟糕局面怎么办？"},

   {id:"s3",type:"dialogue",speaker:"风铃精灵",text:"我试图提前解决所有还没有发生的麻烦。我时时刻刻思虑未来，可越想，内心越慌乱。我被一大堆尚未发生的设想困住。这些担忧占据我全部心神，让我看不见当下。"},

   {id:"s4",type:"dialogue",speaker:"小幽灵",text:"你担忧的事情，全部都是已经实实在在发生了吗？"},

   {id:"s5",type:"dialogue",speaker:"风铃精灵",text:"还没有。但是它们「有可能」发生啊。只要存在可能性，我就应该提前警惕。如果我不去反复思考预案，等到灾难降临，我就毫无准备。"},

   {id:"s6",type:"dialogue",speaker:"小幽灵",text:"区分两件事：有些烦恼，是现在就可以动手行动的；还有一部分担忧，属于暂时没办法掌控、没办法立刻改变的未来。对于后者，反复设想最坏情况，并不能阻止坏事到来，只会不停消耗现在的你。"},

   {id:"s7",type:"dialogue",speaker:"风铃精灵",text:"可是我放不下。只要念头冒出来，我就忍不住一遍一遍推演各种糟糕结局。如果我不去想，就好像我在逃避责任。"},

   {id:"s8",type:"dialogue",speaker:"小幽灵",text:"担忧本身是本能，代表你想要好好面对生活。但不要把「预想风险」变成无休止内耗。我们可以把一堆乱糟糟担心拆开看一看。哪些是此刻就可以迈出一小步去处理；哪些事情，无论怎么焦虑，当下都无能为力。",choices:[

     {label:"陪她一起梳理头脑里的乱糟糟念头",feedback:"风铃精灵坐在广场台阶，闭上眼睛，梳理脑海纷乱念头。",next:"s9"},

     {label:"先问：哪些事是当下能迈出一小步的？",feedback:"风铃精灵想了想：「好像……只有眼前这一小段路。」",next:"s9"}]},

 {id:"numb",title:"麻木",em:"🥀",summary:"褪色的静谧花园",bg:"静谧花园。曾经这里繁花遍野，如今所有花朵褪掉色彩，只剩灰白、浅灰。花瓣软软垂落。听不到虫鸣，闻不到花香。一切安安静静，仿佛整个世界按下静音键。",

  steps:[

   {id:"s1",type:"dialogue",narr:"（小幽灵飘进花园。伸手触碰一朵花，花瓣毫无色彩。整个空间安静得近乎窒息。花园守护者花灵，呆呆站在花坛中间，眼神空洞，对外界几乎没有反应。）",speaker:"花灵",text:"……你来了。这里没有好看景色。所有颜色，好像都从我身上流走了。"},

   {id:"s2",type:"dialogue",speaker:"小幽灵",text:"花园为什么变成这样？"},

   {id:"s3",type:"dialogue",speaker:"花灵",text:"从前，这里花开四季。我会体会喜悦，也会体会悲伤。经历过一连串沉重伤痛之后，慢慢的，我的心拉起一层厚厚的帷幕。为了不再承受痛苦，我好像把全部感受都关掉了。"},

   {id:"s4",type:"dialogue",speaker:"花灵",text:"悲伤不会刺痛我，可是同样，开心、感动、温暖，我也感受不到。就好像活在一层厚厚的雾里面。什么情绪都感觉不到，既不难过，也不快乐。"},

   {id:"s5",type:"dialogue",speaker:"小幽灵",text:"这是你的内心开启的自我保护。当痛苦过于沉重的时候，心灵会暂时关上感知，不让你继续承受伤害。麻木不是你的过错，它是一种自保。只是保护的帷幕待得太久，连同美好的感受一并隔开。"},

   {id:"s6",type:"dialogue",speaker:"花灵",text:"有时候我希望自己可以重新拥有感受。可是我又害怕，如果帷幕掀开，那些很难受的痛苦会再一次狠狠击中我。我不知道该不该走出去。",choices:[

     {label:"如果觉得难受，随时可以退回安全状态",feedback:"花灵轻轻点了点头。",next:"s7"}]},

   {id:"s7",type:"dialogue",speaker:"小幽灵",text:"我们不用一下子把帷幕全部扯开。不必逼迫自己立刻大哭或者大笑。我们可以从很轻很小的感官线索开始，感受一点点温度，一点点声音，一点点气息。可以随时停下，如果觉得难受，可以退回安全状态。试一试，感受风拂过皮肤的温度，听听微风穿过花枝细微沙沙声响。留意脚下泥土淡淡的气息。不需要强迫生出浓烈情绪，仅仅只是观察就可以。不用评判自己「应该有什么感觉」。"},

   {id:"s8",type:"dialogue",narr:"（花灵慢慢深呼吸，集中注意力。一阵微风掠过花园。第一朵小花，花瓣边缘，重新晕开极淡一层粉。不是瞬间姹紫嫣红满园盛放，仅仅一丝浅浅色彩。）",speaker:"花灵",text:"……我好像，感受到风的凉意了。很淡，但是真实存在。我还以为我再也体会不到任何东西。"},

   {id:"s9",type:"dialogue",speaker:"小幽灵",text:"从麻木中恢复，不是一瞬间轰轰烈烈。色彩会一点点回来，中间依旧会夹杂难受时刻。允许过程缓慢，可以随时停下来休息，不用逼迫自己快速「好起来」。"},

   {id:"s10",type:"dialogue",narr:"（一朵接一朵，花朵慢慢染上浅浅的颜色。不会立刻回到往日全盛绚烂，灰白依旧大面积存在，但星星点点鲜活色彩散落在花园各处。有微弱的风声，细碎花叶响动。）",speaker:"花灵",text:"原来麻木是心灵的缓冲罩。它保护我熬过最难熬阶段。现在，我可以一点点，慢慢把感知找回来。不必急，慢慢来就可以。就算有些感受是痛苦，我也有能力一点点承接。"},

 {id:"helpless",title:"无助",em:"🌉",summary:"断裂的雾谷之桥",bg:"浓雾弥漫的雾谷。一道幽深峡谷横亘面前，通往对岸的石桥从中断裂，巨大缺口横亘在峡谷中间，底下云雾翻滚。",

  steps:[

   {id:"s1",type:"dialogue",narr:"（小幽灵穿过层层白雾，落在断桥残存的桥面。巨大裂缝阻断通行。桥灵坐在断桥残垣之上，垂头丧气。对岸隐约能看见美丽的原野，可是没有完整道路能够抵达。）",speaker:"桥灵",text:"这座桥，原本连通峡谷两岸。曾经无数生灵从我身上走过，去往对岸的土地。后来狂风暴雨席卷山谷，桥直接从中断裂。"},

   {id:"s2",type:"dialogue",speaker:"桥灵",text:"我拼命想要把断裂部分拼接回去。单凭我自己力量，无论怎么努力，都没有办法复原整座大桥。我试过耗尽全部力量修补，结果只会让自己越来越虚弱。"},

   {id:"s3",type:"dialogue",speaker:"桥灵",text:"看着对岸美好的风景，我心里充满无力感。我觉得一切只能就这样了。我什么都做不到。我既不能完全修复整座大桥，也没有办法把大家送到彼岸。好像所有努力全部没有意义。"},

   {id:"s4",type:"dialogue",speaker:"小幽灵",text:"你一心想要修好完整的大桥，想要一次性彻底解决全部问题。可是复原整座桥梁，单凭你一个，本就是过于沉重任务。"},

   {id:"s5",type:"dialogue",speaker:"桥灵",text:"难道就只能放弃，永远被困在此处？"},

   {id:"s6",type:"dialogue",speaker:"小幽灵",text:"有两种误区。第一种，认为我必须独立解决全部难题；第二种，如果不能一次性达成完美结局，那么做什么都毫无价值。或许，我们不需要立刻搭建完整横跨峡谷的大桥。我们可以先搭一小段，可以让人往前走一小步就够。同时，也可以寻找其他可以一起来出力的伙伴。"},

   {id:"s7",type:"dialogue",speaker:"桥灵",text:"找别人帮忙？可是我习惯凡事自己硬扛。求助，在我看来代表我很弱小，代表我失败。",choices:[

     {label:"求助不等于无能",feedback:"桥灵静静思索，看向断裂的桥梁。",next:"s8"},

     {label:"分清：什么是力所能及的一小步，什么需要别人支援",feedback:"桥灵低头看着脚下深不见底云雾峡谷，慢慢想。",next:"s8"}]},

   {id:"s8",type:"dialogue",speaker:"小幽灵",text:"人或者生灵的力量本就有限。承认自己单凭一己之力无法搞定全部，并不是缺点。你可以分清两件事：什么是我力所能及的一小步；什么部分，需要别人的支援。"},

   {id:"s9",type:"dialogue",speaker:"桥灵",text:"我没办法一瞬间补好全部巨大缺口。但是，我可以先加固脚下现存桥面，搭建出短短一小截新桥梁，让大家可以向前靠近峡谷中间。剩下遥远距离，我可以去呼唤山谷其他生灵，石头精灵、藤蔓精灵，请大家一起出力。"},

   {id:"s10",type:"dialogue",narr:"（浓雾微微散开。桥灵调动自己残存力量，石块一点点拼接，断桥之上，延伸出短短的一小段新桥。没有直达对岸，但是实实在在向前推进一大截。远处，藤蔓精灵与石精灵听见呼唤，穿过浓雾赶来，愿意共同参与修补工程。）",speaker:"桥灵",text:"我终于明白。无助感来自两件事：一是给自己定下一个单凭自己无法完成的完美目标；二是误以为所有重担必须独自背负。就算达不到最终终点，往前踏出一小步，同样有价值。向他人寻求支持，并不是软弱。"},

   {id:"s11",type:"dialogue",narr:"（峡谷的浓雾慢慢变薄。完整大桥依旧还需要很长时间才可以全部完工，但是不再只有彻底断裂的绝望。已经有一小段道路可以通行，也有伙伴并肩站在一起。）",speaker:"桥灵",text:"我不必一个人扛起全部风雨。分清我能做的小事，敢于向外界寻找帮助，就能够一点点冲破无力的迷雾。"},

   {id:"end",type:"ending",text:"一段小桥搭了起来——不用通到对岸，只要能走到下一个落脚点。"}],

const SAVE_KEY="melancholia_save_v1";

const defaultSave=()=>({
  schemaVersion:2,
  profile:{stage:null,pressureTopics:[],avatarVariant:"default",createdAt:Date.now()},
  onboardingComplete:false,introComplete:false,
  completedChapters:[],chapterProgress:{},
  completedRiverScenarios:[],riverProgress:{},
  unlockedSkins:["default"],unlockedAccessories:INITIAL_ACCESSORIES.slice(),
  equipped:{skinId:"default",accessories:[]},
  settings:{reducedMotion:false,textSpeed:"normal",soundEnabled:false,theme:"fairy",customCss:"",bgImage:""},
});

let save=defaultSave();

function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return;
    const data=JSON.parse(raw);
    if(data.schemaVersion!==1&&data.schemaVersion!==2)return;
    const d=defaultSave();
    save=Object.assign(d,data);
    save.profile=Object.assign({},d.profile,data.profile||{});
    save.settings=Object.assign({},d.settings,data.settings||{});
    save.equipped=Object.assign({},d.equipped,data.equipped||{});
    let migrated=false;
    if(data.schemaVersion===1){
      const oldId=data.equipped&&data.equipped.accessoryId;
      save.equipped.accessories=(oldId&&ACCESSORIES[oldId])?[{id:oldId,x:ACCESSORIES[oldId].def.x,y:ACCESSORIES[oldId].def.y,s:1}]:[];
      delete save.equipped.accessoryId;
      save.schemaVersion=2;migrated=true;
    }
    if(!Array.isArray(save.equipped.accessories)){save.equipped.accessories=[];migrated=true;}
    let accChanged=false;
    save.equipped.accessories=save.equipped.accessories.map(x=>{
     if(x&&(x.id==="scarf"||x.id==="dress")){accChanged=true;return {id:"gloves",x:ACCESSORIES.gloves.def.x,y:ACCESSORIES.gloves.def.y,s:1,st:0};}
     if(x&&typeof x.st!=="number"){accChanged=true;return Object.assign({st:0},x);}
     return x;
    });
    (save.unlockedAccessories||[]).forEach((id,i)=>{if(id==="scarf"||id==="dress"){save.unlockedAccessories[i]="gloves";accChanged=true;}});
    INITIAL_ACCESSORIES.forEach(id=>{if(!save.unlockedAccessories.includes(id)){save.unlockedAccessories.push(id);migrated=true;}});
    if(migrated)persist();
  }catch(e){console.warn("存档损坏，使用新档");save=defaultSave();}
}

function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2400);}

function closeModal(){document.getElementById("modalMask").style.display="none";}

function el(tag,cls,html){const d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d;}

let ghostUid=0,stageSel=-1;

function ghostSVG(color,uid){
  const gid="gg"+uid;
  return `<svg viewBox="0 0 200 220" aria-hidden="true">
    <defs><radialGradient id="${gid}" cx="35%" cy="28%" r="85%"><stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/><stop offset="100%" stop-color="${color}"/></radialGradient></defs>
    <path d="M100 16 C138 16 166 48 166 104 L166 184 q-11 18 -22 0 q-11 18 -22 0 q-11 18 -22 0 q-11 18 -22 0 q-11 18 -22 0 q-11 18 -22 0 L34 104 C34 48 62 16 100 16 Z" fill="url(#${gid})" opacity=".96"/>
    <circle cx="78" cy="88" r="6.5" fill="var(--ghostInk)"/>
    <circle cx="122" cy="88" r="6.5" fill="var(--ghostInk)"/>
    <path d="M88 104 Q100 116 112 104" stroke="var(--ghostInk)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="62" cy="106" r="8" fill="var(--blush)" opacity=".5"/>
    <circle cx="138" cy="106" r="8" fill="var(--blush)" opacity=".5"/>
  </svg>`;
}

function ghostHTML(interactive,stageId){
  ghostUid++;
  const skin=SKINS[save.equipped.skinId]||SKINS.default;
  const accs=(save.equipped.accessories||[]).map((a,i)=>{
    const d=ACCESSORIES[a.id];if(!d)return"";
    const sty=accStyle(a);
    return `<img class="acc-img${interactive&&i===stageSel?" sel":""}" data-idx="${i}" src="${sty.img}" alt="${sty.name}" draggable="false" style="left:${a.x}%;top:${a.y}%;width:${Math.round(d.def.w*(a.s||1))}%">`;
  }).join("");
  return `<div class="ghost-avatar${interactive?" ghost-stage":""}"${stageId?` id="${stageId}"`:""}>${ghostSVG(skin.color,ghostUid)}${accs}</div>`;
}

function stripBrackets(s){return String(s==null?"":s).replace(/（[^）]*）|\([^)]*\)/g,"").trim()}

function chunkText(s,max){
  max=max||64;const t=stripBrackets(s);if(!t)return[];
  if(t.length<=max)return[t];
  const parts=t.split(/(?<=[。！？!?…])/);const out=[];let cur="";
  parts.forEach(p=>{if(!p)return;if((cur+p).length>max&&cur){out.push(cur.trim());cur=p;}else{cur+=p;}});
  if(cur.trim())out.push(cur.trim());
  return out;
}

function spkColor(name){let h=0;const str=String(name||"");for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return SPK_COLORS[h%SPK_COLORS.length];}

function pushMsg(box,kind,speaker,text,delay){
  const m=el("div","msg "+kind);
  if(speaker)m.appendChild(el("div","msg-name",speaker));
  m.appendChild(el("div","msg-text",text));
  if(kind==="other"&&speaker)m.style.setProperty("--spk",spkColor(speaker));
  if(delay)m.style.animationDelay=delay+"ms";
  box.appendChild(m);return m;
}

function renderChat(box,lines){
  let delay=0;
  (lines||[]).forEach(l=>{
    const narr=stripBrackets(l.narr);
    if(narr){pushMsg(box,"narr",null,narr,delay);delay+=60;}
    const chunks=chunkText(l.text!=null?l.text:l.t);
    const isGhost=l.speaker==="小幽灵";
    chunks.forEach((c,i)=>{pushMsg(box,isGhost?"ghost":"other",i===0?l.speaker:null,c,delay);delay+=60;});
  });
}

function renderPrologue(){

  const list=el("div","chat-list");p.appendChild(list);
  const flat=[];
  PROLOGUE_LINES.forEach(l=>{
   const narr=stripBrackets(l.narr);
   if(narr)flat.push({kind:"narr",speaker:null,text:narr});
   const spk=(l.speaker!=null?l.speaker:l.s);
   const isGhost=spk==="小幽灵";
   const txt=(l.text!=null?l.text:l.t);
   chunkText(txt).forEach((c,i)=>flat.push({kind:isGhost?"ghost":"other",speaker:i===0?spk:null,text:c}));
  });
  let idx=0,done=false;
  const finRow=el("div","btnrow");
  const finB=el("button","btn primary","完成序章，出发");
  finB.style.display="none";
  finB.onclick=()=>{save.introComplete=true;persist();toast("序章完成 ✓");go("home");};
  finRow.appendChild(finB);
  const skipB=el("button","btn ghost","跳过序章");
  skipB.onclick=finB.onclick;
  finRow.appendChild(skipB);
  const tap=el("div","prologue-tap","▾ 轻触任意位置，继续对话");
  function finish(){if(done)return;done=true;tap.style.display="none";finB.style.display="";}
  function reveal(){
   if(done)return;
   if(idx>=flat.length){finish();return;}
   const c=flat[idx++];
   pushMsg(list,c.kind,c.speaker,c.text,0);
   window.scrollTo({top:document.body.scrollHeight,behavior:document.body.classList.contains("reduced-motion")?"auto":"smooth"});
   if(idx>=flat.length)finish();
  }
  tap.onclick=reveal;
  list.onclick=reveal;
  p.appendChild(tap);
  p.appendChild(finRow);
  reveal();
  return p;
}

 function stage2(){
  const thoughts=(st.takenBubbles&&st.takenBubbles.length?st.takenBubbles.slice():S.bubbles.slice());
  box.appendChild(el("p","stage-tip","<b>信念连线</b> · 先点一个左边的<b>想法</b>，再点一个右边的<b>信念</b>，把它们连起来；点已经连线的想法可以断开重连。没有标准答案，也可能不止一种连法。"));
  const board=el("div","match-board");
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","match-lines");
  const colL=el("div","match-col"),colR=el("div","match-col");
  thoughts.forEach(t=>{
   const it=el("div","match-item thought",t);it.dataset.thought=t;
   it.onclick=()=>{
    if(st.pairs[t]){delete st.pairs[t];persist();toast("已断开这根连线");paint();return;}
    st.selThought=(st.selThought===t?null:t);paint();
   };
   colL.appendChild(it);
  });
  S.beliefs.forEach(bf=>{
   const it=el("div","match-item belief",bf.text);it.dataset.bid=bf.id;
   it.onclick=()=>{
    if(!st.selThought){toast("先点一个左边的想法，再点这里连起来");return;}
    const used=Object.keys(st.pairs).find(k=>st.pairs[k]===bf.id&&k!==st.selThought);
    if(used)delete st.pairs[used];
    st.pairs[st.selThought]=bf.id;
    st.selThought=null;persist();
    toast("连好了 ✓ 想法只是想法，不是事实");
    paint();
   };
   colR.appendChild(it);
  });
  board.appendChild(svg);board.appendChild(colL);board.appendChild(colR);
  box.appendChild(board);
  const summary=el("div","pair-summary");box.appendChild(summary);
  function paint(){
   board.querySelectorAll(".match-item").forEach(n=>{
    const t=n.dataset.thought,b=n.dataset.bid;
    n.classList.toggle("pick",!!t&&st.selThought===t);
    n.classList.toggle("linked",t?!!st.pairs[t]:Object.values(st.pairs).includes(b));
   });
   summary.innerHTML="";
   const ks=Object.keys(st.pairs);
   if(ks.length){
    ks.forEach(t=>{
     const bf=S.beliefs.find(x=>x.id===st.pairs[t]);
     summary.appendChild(el("span","pair-chip","「"+t+"」 ↔ "+(bf?bf.text:"")));
    });
    summary.appendChild(el("p","small-note","这些只是「想法」，不是事实，也不是你的错误；连法没有对错，随时可以断开重连。"));
    nextBtn.disabled=false;
   }else{
    summary.appendChild(el("p","small-note","还没有连线；也可以点下方按钮先继续。"));
   }
   draw();
  }
  function draw(){
   svg.innerHTML="";
   const br=board.getBoundingClientRect();
   Object.keys(st.pairs).forEach(t=>{
    const a=board.querySelector('.match-item[data-thought="'+CSS.escape(t)+'"]');
    const b=board.querySelector('.match-item[data-bid="'+st.pairs[t]+'"]');
    if(!a||!b)return;
    const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
    const x1=ra.right-br.left,y1=ra.top+ra.height/2-br.top;
    const x2=rb.left-br.left,y2=rb.top+rb.height/2-br.top;
    const pth=document.createElementNS("http://www.w3.org/2000/svg","path");
    pth.setAttribute("d","M"+x1+" "+y1+" C"+(x1+40)+" "+y1+","+(x2-40)+" "+y2+","+x2+" "+y2);
    svg.appendChild(pth);
    [[x1,y1],[x2,y2]].forEach(pt=>{
     const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
     c.setAttribute("cx",pt[0]);c.setAttribute("cy",pt[1]);c.setAttribute("r","4");svg.appendChild(c);
    });
   });
  }
  window.addEventListener("resize",()=>{if(document.body.contains(board))draw();});
  paint();
  if(Object.keys(st.pairs).length)nextBtn.disabled=false;
  const skipB=el("button","btn ghost","先继续");
  skipB.onclick=()=>{st.stage=3;advance();};
  row.appendChild(skipB);
 }

  st.evidence.push(hid);

  if(!save.unlockedAccessories.includes("pearl"))save.unlockedAccessories.push("pearl");

  persist();

}

let accStageBound=false;

function attachAccStage(){
  if(accStageBound)return;
  accStageBound=true;
  let pressed=false,drag=false,px=0,py=0,sx=0,sy=0,holdT=null,pid=null;
  function stageOf(t){return t&&t.closest?t.closest(".ghost-stage"):null;}
  function markSel(stage){stage.querySelectorAll(".acc-img").forEach(n=>n.classList.toggle("sel",parseInt(n.dataset.idx,10)===stageSel));}
  function hint(txt){const h=document.querySelector(".sel-hint");if(h)h.textContent=txt;}
  function moveAcc(stage,ev){
   const a=(save.equipped.accessories||[])[stageSel];if(!a)return;
   const r=stage.getBoundingClientRect();
   a.x=Math.max(4,Math.min(96,Math.round((a.x+(ev.clientX-px)/r.width*100)*10)/10));
   a.y=Math.max(4,Math.min(96,Math.round((a.y+(ev.clientY-py)/r.height*100)*10)/10));
   px=ev.clientX;py=ev.clientY;
   const img=stage.querySelector('.acc-img[data-idx="'+stageSel+'"]');
   if(img){img.style.left=a.x+"%";img.style.top=a.y+"%";}
  }
  function startDrag(stage){if(!drag){drag=true;stage.classList.add("dragging");}}
  function end(){
   clearTimeout(holdT);holdT=null;
   if(drag)persist();
   pressed=false;drag=false;pid=null;
   const stage=document.getElementById("accStage");
   if(stage)stage.classList.remove("dragging");
  }
  function down(ev){
   const stage=stageOf(ev.target);if(!stage)return;
   const t=ev.target.closest(".acc-img");if(!t)return;
   if(ev.preventDefault)ev.preventDefault();
   if(stage.setPointerCapture&&ev.pointerId!=null){try{stage.setPointerCapture(ev.pointerId);}catch(_){}}
   const prev=stageSel;
   stageSel=parseInt(t.dataset.idx,10);markSel(stage);
   const acc=(save.equipped.accessories||[])[stageSel];
   if(stageSel!==prev&&acc&&ACCESSORIES[acc.id]){const msg="已选中「"+accName(acc)+"」· 长按拖动，＋/－ 缩放，可换款式、调图层";toast(msg);hint(msg);}
   pressed=true;drag=false;pid=ev.pointerId!=null?ev.pointerId:"m";
   px=sx=ev.clientX;py=sy=ev.clientY;
   clearTimeout(holdT);
   holdT=setTimeout(()=>{if(pressed)startDrag(stage);},260);
  }
  function move(ev){
   if(!pressed)return;
   const stage=stageOf(ev.target)||document.getElementById("accStage");
   if(!stage)return;
   if(ev.pointerId!=null&&pid!=null&&ev.pointerId!==pid)return;
   if(!drag){
    if(Math.abs(ev.clientX-sx)>8||Math.abs(ev.clientY-sy)>8)startDrag(stage);
    else return;
   }
   moveAcc(stage,ev);
  }
  document.addEventListener("pointerdown",down,true);
  document.addEventListener("pointermove",move,true);
  document.addEventListener("pointerup",end,true);
  document.addEventListener("pointercancel",end,true);
  document.addEventListener("contextmenu",function(ev){if(stageOf(ev.target)&&ev.target.closest(".acc-img"))ev.preventDefault();},true);
  if(!window.PointerEvent){
   function tpt(ev){const t0=ev.changedTouches&&ev.changedTouches[0];return t0?{clientX:t0.clientX,clientY:t0.clientY}:null;}
   document.addEventListener("touchstart",function(ev){
    if(!stageOf(ev.target))return;
    const p=tpt(ev);if(!p)return;
    down({target:ev.target,clientX:p.clientX,clientY:p.clientY,pointerId:"t",preventDefault:function(){ev.preventDefault();}});
   },{passive:false});
   document.addEventListener("touchmove",function(ev){
    if(!pressed)return;
    const p=tpt(ev);if(!p)return;
    move({clientX:p.clientX,clientY:p.clientY,pointerId:"t"});
    ev.preventDefault();
   },{passive:false});
   document.addEventListener("touchend",function(){if(pressed)end();},true);
   document.addEventListener("touchcancel",function(){if(pressed)end();},true);
   document.addEventListener("mousedown",function(ev){
    if(!stageOf(ev.target))return;
    down({target:ev.target,clientX:ev.clientX,clientY:ev.clientY,pointerId:"m",preventDefault:function(){}});
   },true);
   window.addEventListener("mousemove",function(ev){if(pressed)move({clientX:ev.clientX,clientY:ev.clientY,pointerId:"m"});});
   window.addEventListener("mouseup",function(){if(pressed)end();});
  }
}

function doClearSave(){

function applySettings(){
  document.body.classList.toggle("reduced-motion",!!save.settings.reducedMotion);
  document.body.dataset.textSpeed=save.settings.textSpeed||"normal";
  applyTheme();applyBg();applyCustomCss();
}

function applyTheme(){
  const t=(save.settings.theme&&THEMES[save.settings.theme])?save.settings.theme:"fairy";
  document.documentElement.setAttribute("data-theme",t);
}

function applyBg(){
  const bl=document.getElementById("bgLayer");
  if(bl)bl.style.backgroundImage=save.settings.bgImage?('url('+save.settings.bgImage+')'):"";
  document.body.classList.toggle("has-bg",!!save.settings.bgImage);
}

function applyCustomCss(){
  let st=document.getElementById("customCssStyle");
  if(!st){st=document.createElement("style");st.id="customCssStyle";document.head.appendChild(st);}
  st.textContent=save.settings.customCss||"";
}

function compressImage(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1280;let w=img.width,h=img.height;
      if(!w||!h){toast("无法读取这张图片");return;}
      if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      try{cb(c.toDataURL("image/jpeg",.82));}
      catch(e){toast("图片太大了，换一张试试");}
    };
    img.onerror=()=>toast("无法读取这张图片");
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

/* ---- 本地背景音乐 ---- */

let bgmAudio=null;

function loadBGM(file){

 try{

  if(bgmAudio){bgmAudio.pause();bgmAudio.src="";}

  bgmAudio=new Audio();

  bgmAudio.src=URL.createObjectURL(file);

  bgmAudio.loop=true;

  bgmAudio.volume=0.5;

  bgmAudio.play().then(()=>{

   save.settings.soundEnabled=true;persist();

   toast("背景音乐已开始播放 🎵");

  }).catch(()=>toast("浏览器阻止了自动播放，请再按一次播放按钮"));

 }catch(e){toast("无法加载该音频文件");}

}

let deferredPrompt=null;

window.addEventListener("beforeinstallprompt", (e) => {

  e.preventDefault();

  deferredPrompt=e;

  showInstallButton();

});

function showInstallButton(){

  const bar=document.querySelector(".navbar");

  if(!bar||document.getElementById("installBtn"))return;

  const b=document.createElement("button");

  b.id="installBtn";b.className="btn small";b.textContent="📲 安装";

  b.onclick=async()=>{

    if(!deferredPrompt)return;

    deferredPrompt.prompt();

    await deferredPrompt.userChoice;

    deferredPrompt=null;b.remove();

  };

  bar.appendChild(b);

}
